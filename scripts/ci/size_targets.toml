# Proposed in hud-3n24e.17 for owner review. Upper endpoints are from the
# 2026-11-22 greenfield sketch §1.5 (Rust) and §1.8 (client skills).
# The sketch estimates logical lines. The report counts tracked physical lines.
# Surface names below are the grouping keys in size_report.py's ordinary report.
# Use the owner-merge hold and cite signed owner approval when changing
# ceilings, mappings or permanent allowances. Retire a deleted surface's mapping
# in its removal PR so subsequent comparisons can resolve every remaining name.

[targets.core]
surfaces = ["crates/tze_hud_scene"]
rust = 14000
rust_test = 10500

[targets.config]
surfaces = ["crates/tze_hud_config"]
rust = 5500
rust_test = 3000

[targets.widget]
surfaces = ["crates/tze_hud_widget"]
rust = 3000
rust_test = 2000

[targets.render]
surfaces = ["crates/tze_hud_compositor"]
rust = 13500
rust_test = 5000

[targets.ui_and_shell]
# Windowed runtime interleaves both roles with orchestration. Input and portal
# crates share that boundary today. Sum the sketch's UI and shell endpoints.
surfaces = ["crates/tze_hud_runtime", "crates/tze_hud_input", "crates/tze_hud_portal"]
rust = 22000
rust_test = 7000

[targets.api]
surfaces = ["crates/tze_hud_mcp", "crates/tze_hud_protocol", "crates/tze_hud_resource"]
rust = 10500
rust_test = 7000

[targets.app]
surfaces = ["app/tze_hud_app"]
rust = 2500
rust_test = 1000

[targets.integration]
surfaces = ["tests/integration"]
rust_test = 5000

[targets.tools]
# The sketch names token footprint (inside benchmark), the demo and load harness.
surfaces = ["examples/benchmark", "examples/poc_demo", "examples/widget_publish_load_harness"]
rust = 1800

[targets.client_skills]
surfaces = [".claude/skills"]
python = 1500
markdown = 900

# Each [[allowances]] entry records a feature identifier, an approval reference
# to its owner-signed spec, a target name and additional lines per granted metric.
# CI checks that the reference is present. The owner verifies that the cited
# spec grants the recorded allowance when reviewing the PR.

# A new [[inflight_allowances]] entry records the feature, approval (signed
# spec), signed_at (date or offset timestamp), decision (hud-3n24e.32), target
# and positive line counts for the metrics above their ceilings. Section
# "Git / GitHub Workflow" in AGENTS.md gives the cutoff and review procedure.
# Later comparisons keep the original entry as evidence and apply no credit.

