approval = "hud-66nb0.1 design field: owner-signed spec, questionnaire item funnel-r4-1-overlay-shell-spec (packet tze-hud-2026-11-21-funnel, option A)"
signed_at = "2026-11-21"
decision = "hud-3n24e.32"
target = "ui_and_shell"
rust = 21
rust_test = 43

