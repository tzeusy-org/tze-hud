# tze_hud — weekly performance-budget lane.
#
# These jobs take ~10 minutes each, past the 6-minute merge-gate target, so
# they run weekly, on demand, and on PRs labelled `perf-assert` instead of on
# every PR. They are not required checks.
#
#   windows-performance-budget  — headless Windows benchmark + locked budget gate,
#     plus a real constrained WARP overlay quiescent-efficiency artifact gate
#   constrained-envelope-budget — llvmpipe proxy, exactly two logical CPUs,
#     same normalized ceilings
#   timing-asserts — gated portal cadence and vertical slice timing assertions

name: Performance budget

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 03:00 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled]

env:
  # apt retries and network timeouts: a stalled mirror fails fast instead of
  # hanging the job (a 51-minute mingw-w64 install once timed out the merge queue).
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Force software GPU (llvmpipe on Linux, WARP on Windows) for headless rendering.
  # Tests that call HeadlessRuntime::new() will use a software adapter.
  HEADLESS_FORCE_SOFTWARE: "1"

jobs:
  windows-performance-budget:
    name: Windows performance budget
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'perf-assert'
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Run headless benchmark artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path test_results/windows-performance-budget | Out-Null
          cargo run -p benchmark --features headless -- `
            --emit test_results/windows-performance-budget/benchmark.json `
            --frames 180
      - name: Enforce locked Windows budgets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/ci/check_windows_perf_budgets.py `
            --benchmark-json test_results/windows-performance-budget/benchmark.json `
            --output-json test_results/windows-performance-budget/budget-gate.json
      - name: Build canonical windowed runtime for quiescent evidence
        shell: pwsh
        run: cargo build -p tze_hud_app --release
      - name: Prove static overlay idle efficiency on WARP / two CPUs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\ci\windows\run-quiescent-efficiency.ps1 `
            -ExePath target\release\tze_hud.exe `
            -OutputDir test_results\windows-performance-budget\quiescent-efficiency
      # Only exact main attempts with both original budget jobs green can
      # establish a trend baseline. The separate timing verdict is independent.
      - name: Select main-pinned Windows perf baseline
        id: perf-baseline
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/select_windows_perf_baseline.py
      - name: Download main-pinned Windows perf baseline
        id: perf-baseline-download
        if: ${{ !cancelled() && steps.perf-baseline.outputs.artifact-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.perf-baseline.outputs.artifact-id }}
          run-id: ${{ steps.perf-baseline.outputs.run-id }}
          github-token: ${{ github.token }}
          path: perf-baseline-main
          digest-mismatch: error
      - name: Report Windows perf trend deltas (vs main baseline)
        if: always()
        shell: pwsh
        env:
          BASELINE_DOWNLOAD_OUTCOME: ${{ steps.perf-baseline-download.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $baseline = "perf-baseline-main/budget-gate.json"
          $baselineArg = @()
          if ($env:BASELINE_DOWNLOAD_OUTCOME -eq 'success' -and (Test-Path $baseline)) {
            $baselineArg = @("--baseline", $baseline)
          }
          python scripts/ci/report_telemetry_trend.py `
            --current test_results/windows-performance-budget/budget-gate.json `
            @baselineArg
      # Publish this run's summary as the main-pinned baseline artifact. Only
      # scheduled/manual runs on main update the baseline (PR runs must not overwrite it),
      # and only when the run is green up to here — a failed gate must not become
      # the baseline future runs trend against.
      - name: Publish main-pinned Windows perf baseline
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: windows-perf-baseline-main-attempt-${{ github.run_attempt }}
          path: test_results/windows-performance-budget/budget-gate.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows performance artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-performance-budget
          path: test_results/windows-performance-budget/
          if-no-files-found: error

  constrained-envelope-budget:
    name: Constrained-envelope budget (llvmpipe / 2 CPUs)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'perf-assert'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install benchmark dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            mesa-vulkan-drivers \
            util-linux
      - name: Run constrained-envelope benchmark and unchanged normalized budget gate
        run: scripts/ci/run_constrained_envelope.sh
      - name: Upload constrained-envelope artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: constrained-envelope-budget
          path: test_results/constrained-envelope-budget/
          if-no-files-found: error

  timing-asserts:
    name: Linux timing assertions
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.label.name == 'perf-assert'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install Mesa / llvmpipe
        id: mesa
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri

      # Keep the portal's original hard verdict and retain its historical
      # 358829us and 535336us burst misses against 250000us.
      # https://github.com/tzeusy-org/tze-hud/actions/runs/45155588920
      # https://github.com/tzeusy-org/tze-hud/actions/runs/42591938633
      - name: Assert portal cadence timing budgets
        shell: bash
        env:
          TZE_HUD_PERF_ASSERT: "1"
        run: |
          mkdir -p test_results/perf-assert
          cargo test -p integration --test it text_stream_portal_cadence:: -- --nocapture \
            2>&1 | tee test_results/perf-assert/portal.log
      - name: Assert vertical slice timing budgets
        if: ${{ !cancelled() && steps.mesa.outcome == 'success' }}
        shell: bash
        env:
          TZE_HUD_PERF_ASSERT: "1"
        run: |
          mkdir -p test_results/perf-assert
          cargo test -p vertical_slice --test budget_assertions -- --nocapture \
            2>&1 | tee test_results/perf-assert/budget.log

      - name: Collect p99 JSON trend artifacts
        if: ${{ !cancelled() && hashFiles('test_results/perf-assert/budget.log') != '' }}
        run: |
          mkdir -p test_results/perf-assert
          python3 - <<'EOF'
          import json, re, pathlib

          log = pathlib.Path("test_results/perf-assert/budget.log").read_text(errors="replace")
          entries = []
          for line in log.splitlines():
              # Match PASS lines: "[PASS] metric p99=NNNus within budget=MMMus ..."
              m_pass = re.match(
                  r'\[PASS\]\s+(\S+)\s+p99=(\d+)us\s+within.*?budget=(\d+)us',
                  line,
              )
              if m_pass:
                  entries.append({
                      "status": "PASS",
                      "metric": m_pass.group(1),
                      "p99_us": int(m_pass.group(2)),
                      "budget_us": int(m_pass.group(3)),
                  })
                  continue
              # Match SKIP-TIMING lines: "[SKIP-TIMING] metric raw_p99=NNNus; ..."
              m_skip = re.match(r'\[SKIP-TIMING\]\s+(\S+)\s+raw_p99=(\d+)us', line)
              if m_skip:
                  entries.append({
                      "status": "SKIP-TIMING",
                      "metric": m_skip.group(1),
                      "p99_us": int(m_skip.group(2)),
                  })
                  continue
              # Match UNCALIBRATED lines: "[UNCALIBRATED] metric raw_p99=NNNus; ..."
              m_uncal = re.match(r'\[UNCALIBRATED\]\s+(\S+)\s+raw_p99=(\d+)us', line)
              if m_uncal:
                  entries.append({
                      "status": "UNCALIBRATED",
                      "metric": m_uncal.group(1),
                      "p99_us": int(m_uncal.group(2)),
                  })

          out = pathlib.Path("test_results/perf-assert/budget-p99.json")
          out.write_text(json.dumps({"entries": entries}, indent=2))
          print(f"Captured {len(entries)} p99 entries -> {out}")
          EOF

      - name: Upload p99 trend artifacts
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && hashFiles('test_results/perf-assert/*.log') != '' }}
        with:
          name: perf-assert-budget-p99
          path: test_results/perf-assert/
          if-no-files-found: warn
