# Windows build, boot smoke, and release.
#
# windows-build — native x86_64-pc-windows-msvc optimized build on a Windows
#   runner, then boots the binary with the production config (WARP software
#   rendering) and drives the MCP lifecycle (scripts/ci/windows_smoke.py),
#   (also: widget and notification TTL, delay_ms, and a killed resident tile
#   reclaimed after its grace, plus an informational idle-with-content
#   measurement), then exercises self-install, single instance, and uninstall
#   (scripts/ci/windows_install_smoke.py).
#   Runs on non-docs PRs and main pushes, v* tags, and manual dispatch.
#   PRs skip the informational idle measurement and run theme captures (and
#   the changed-scene comment) only when they touch rendered paths, and the
#   T13 gesture scenarios only for rendered, input or portal paths, keeping
#   the PR run near 10 min and off the shared runner pool; main pushes run
#   everything, so the capture baseline and idle trend stay complete.
#   Informational: omit merge_group while this check is not required. Restore
#   merge_group in the same hud-bstmy.8.8 change that makes it required.
#   Docs-only PR/main updates skip; tag and manual runs are unaffected.
#   Non-tag events use release-dev; v* tags keep the full release profile.
# release — signs the exe with minisign (secret MINISIGN_SECRET_KEY; public key
#   app/tze_hud_app/minisign.pub) and publishes it:
#     push to main → rolling `dev` prerelease (tag `dev` moves to the commit)
#     v* tag       → a release for that tag
#   Hosts install and update from these releases; see docs/operations.

name: windows

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-build:
    name: windows build + boot smoke
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      # Changed-only capture comment; fork tokens may be read-only. Never use
      # pull_request_target or grant write access to repository contents.
      pull-requests: write
    env:
      HUD_BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'release-dev' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # PR checkouts are the merge commit; HEAD^1 is the base for the
          # rendered-path filter below.
          fetch-depth: 2

      # Paths whose change can alter a captured frame. Non-PR events always capture.
      - name: Detect rendered-path changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            { echo rendered=true; echo gestures=true; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee "$RUNNER_TEMP/changed-files.txt"
          rendered='^(crates/tze_hud_(compositor|widget|scene|config|runtime)/|app/tze_hud_app/|assets/|\.claude/skills/user-test/scripts/[^/]+\.json$|scripts/ci/windows_smoke\.py$|Cargo\.lock$|\.github/workflows/windows\.yml$)'
          # Gestures also follow input, portal and the harness itself.
          gestures="$rendered|^(crates/tze_hud_(input|portal|mcp)/|scripts/ci/hud_(gestures|sendinput)\.py$)"
          if grep -Eq "$rendered" "$RUNNER_TEMP/changed-files.txt"; then
            echo rendered=true >> "$GITHUB_OUTPUT"
          else
            echo rendered=false >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "$gestures" "$RUNNER_TEMP/changed-files.txt"; then
            echo gestures=true >> "$GITHUB_OUTPUT"
          else
            echo gestures=false >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          shared-key: windows-msvc-${{ env.HUD_BUILD_PROFILE }}

      - name: Build tze_hud.exe (selected profile, static CRT)
        env:
          # Reported by /admin/status: `dev` on main, the tag on tags, else `ci`.
          TZE_HUD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'dev' || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci') }}
        shell: pwsh
        run: |
          $profileArgs = if ($env:HUD_BUILD_PROFILE -eq "release") { @("--release") } else { @("--profile", "release-dev") }
          cargo build @profileArgs --locked -p tze_hud_app --bin tze_hud
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Non-tags cover the runtime library; tags retain the remote fixtures.
      # Fresh per-step storage isolates headless element/widget persistence.
      - name: Runtime unit tests and app parser (selected profile)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ("runtime-unit-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA | Out-Null
          $profileArgs = if ($env:HUD_BUILD_PROFILE -eq "release") { @("--release") } else { @("--profile", "release-dev") }
          if ($env:HUD_BUILD_PROFILE -eq "release") {
            cargo test --release --locked -p tze_hud_runtime --lib firewall::remote:: -- --nocapture
          } else {
            cargo test --profile release-dev --locked -p tze_hud_runtime --lib -- --nocapture
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test @profileArgs --locked -p tze_hud_app --bin tze_hud parse_options_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # hud-ljhku.13: emoji/CJK fallback through the real Microsoft faces,
      # loaded by name from the registry; faces the runner lacks are skipped
      # and recorded in the log (windows-latest is Windows Server).
      - name: Font fallback with system faces (tier-W)
        if: steps.changes.outputs.rendered == 'true' && !startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 15
        shell: pwsh
        run: |
          cargo test --profile release-dev --locked -p tze_hud_compositor --lib fonts::tests:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Boot smoke (production config, MCP lifecycle, POC stages)
        timeout-minutes: 10
        env:
          TZE_HUD_LOG: error,tze_hud_mcp_phases=debug,tze_hud_delay_diagnostic=debug
          TZE_HUD_LOG_JSON: "1"
        run: python scripts/ci/windows_smoke.py --diagnostics "$env:RUNNER_TEMP/windows-smoke-diagnostics" --exe "target/$env:HUD_BUILD_PROFILE/tze_hud.exe" --config app/tze_hud_app/config/production.toml

      - name: Upload original boot-smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/windows-smoke-diagnostics/
          if-no-files-found: warn

      # Informational, not a gate: boots a second HUD under the runtime's own
      # constrained WARP fullscreen measurement (5 s settle + 60 s), with held
      # content on screen. Its artifact and actual HUD exit must both qualify;
      # job success alone is not artifact validity. continue-on-error keeps a
      # WARP timing flake from failing the build until the owner decides to
      # require it (see the PR that added it for the stability record).
      - name: Quiescent with content (informational)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci/windows_smoke.py --quiescent-with-content --exe "target/$env:HUD_BUILD_PROFILE/tze_hud.exe" --config app/tze_hud_app/config/production.toml

      - name: Install, single-instance, uninstall smoke
        timeout-minutes: 5
        run: python scripts/ci/windows_install_smoke.py --exe "target/$env:HUD_BUILD_PROFILE/tze_hud.exe"

      # T13 tier W, informational: real SendInput into a HUD this step starts
      # (fullscreen WARP, then overlay lavapipe including native tray controls),
      # asserting on /admin/status. Overflow leaves an explicit menu-proof limit.
      # It refuses if any tze_hud.exe is already running. Scenarios and guards:
      # scripts/ci/hud_gestures.py. Results land in the step summary.
      - name: Gesture scenarios (informational, SendInput)
        id: gestures
        if: steps.changes.outputs.gestures == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python scripts/ci/hud_gestures.py --injector sendinput --exe "target/$env:HUD_BUILD_PROFILE/tze_hud.exe" --out "$env:RUNNER_TEMP/gestures"
          $fullscreenExit = $LASTEXITCODE
          # Install the software Vulkan ICD only after WARP has finished. The
          # wrapper verifies the pinned archive before extraction and removes
          # its exact registry value in finally, including on scenario failure.
          python scripts/ci/windows_overlay_gestures.py --exe "target/$env:HUD_BUILD_PROFILE/tze_hud.exe" --out "$env:RUNNER_TEMP/gestures/overlay"
          if ($fullscreenExit -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload gesture evidence
        if: always() && steps.gestures.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: gestures
          path: ${{ runner.temp }}/gestures/
          if-no-files-found: warn

      # Own-frame WARP comparisons are informational, not owner signoff or a
      # required check. First main run bootstraps an explicitly absent baseline.
      - name: Theme fixture captures (informational)
        id: captures
        if: steps.changes.outputs.rendered == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/windows_smoke.py --captures "$env:RUNNER_TEMP/windows-captures" --exe "target/$env:HUD_BUILD_PROFILE/tze_hud.exe" --config app/tze_hud_app/config/production.toml

      - name: Upload theme captures
        id: capture-upload
        if: always() && steps.captures.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: windows-captures
          path: ${{ runner.temp }}/windows-captures/captures.zip
          compression-level: 0
          if-no-files-found: error

      - name: Changed-scene PR comment (informational)
        if: github.event_name == 'pull_request' && steps.captures.outcome == 'success' && steps.capture-upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/windows_smoke.py --capture-comment "$env:RUNNER_TEMP/windows-captures"

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$HUD_BUILD_PROFILE/tze_hud.exe" dist/
          cp "target/$HUD_BUILD_PROFILE/tze_hud.pdb" dist/ 2>/dev/null || echo "no PDB emitted"
          (cd dist && sha256sum tze_hud.exe > tze_hud.exe.sha256)
          cat dist/tze_hud.exe.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: tze_hud-windows-msvc
          path: dist/
          if-no-files-found: error

  release:
    name: sign + publish release
    needs: [windows-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: tze_hud-windows-msvc
          path: dist

      - name: Install minisign
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends minisign

      - name: Sign and verify against the committed public key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # The same channel the exe was built with (TZE_HUD_CHANNEL). The
          # trusted comment carries it so a self-update can refuse a build
          # signed for another channel (a dev build says `dev`, not `main`).
          RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'dev' || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci') }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set; refusing to publish an unsigned release"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/tze_hud.exe -t "tze_hud ${RELEASE_CHANNEL} ${GITHUB_SHA}"
          rm -f "$key"
          minisign -V -p app/tze_hud_app/minisign.pub -m dist/tze_hud.exe

      - name: Publish rolling dev prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev dist/* \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "dev ${GITHUB_SHA::7}" \
            --notes "Rolling build of main at ${GITHUB_SHA}. Verify: minisign -Vm tze_hud.exe -p minisign.pub"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
