# tze_hud CI — merge gates.
#
# Merge-gate jobs must finish in under ~8 minutes. Anything slower goes in the
# weekly lanes (perf-budget.yml, perf-assert.yml). Every job has a job-level
# timeout-minutes and every apt step has its own, so a stalled runner or
# mirror fails fast instead of timing out the merge queue.
#
# Required checks (ruleset "main merge queue"; job `name:`s must not change):
#   cargo check, cargo fmt, cargo clippy, cargo test (unit),
#   vertical_slice production config boot, canonical app production config boot gate,
#   dev-mode guard (release build), cargo clippy (windows-gnu cross-target)
#
# Job map:
#   check          — cargo check: fast compilation gate (no codegen)
#                    + cargo machete (unused dependencies)
#                    + fail-closed idle-efficiency checker contract tests
#   fmt            — cargo fmt --check
#   clippy         — cargo clippy --all-targets -D warnings (incl. tests/examples/benches)
#   clippy-windows-gnu — cargo clippy --target x86_64-pc-windows-gnu -D warnings on the
#     crates carrying cfg(windows) code, which the Linux clippy job never compiles
#   test-unit      — cargo test --workspace --all-targets --exclude integration
#   test-integration — cargo test -p integration --tests
#                    + deterministic LLM-facing token-footprint gate
#   production-boot-vertical-slice / canonical-app-production-boot — boot the
#     runtime with the committed production configs
#   user-test-python-suite — pytest over the user-test and repo script suites;
#     pure-Python tests only, with no GPU, Windows, live HUD runtime, or network
#   dev-mode-guard — cargo-metadata check (no build) that dev-mode is not enabled in the
#     default-build dependency closure of any workspace package, incl. the shipped
#     binary (the actual release build runs in windows.yml)
#   cargo-deny     — advisories + licenses + bans + sources (workflow-blocking;
#     outside the current eight required checks)
#   test-gpu-pixel-readback — pixel readback on llvmpipe (informational duplicate: the
#     same pixel_readback tests already run, blocking, inside test-unit via workspace
#     feature unification of tze_hud_runtime/dev-mode)
#
# GPU jobs run with HEADLESS_FORCE_SOFTWARE=1 (llvmpipe on Linux) so no
# hardware GPU is needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: required checks must also run on the queue's temporary
  # `gh-readonly-queue/main/*` branches, or queued PRs never become mergeable.
  merge_group:

env:
  # apt retries and network timeouts: a stalled mirror fails fast instead of
  # hanging the job (a 51-minute mingw-w64 install once timed out the merge queue).
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Force software GPU (llvmpipe on Linux, WARP on Windows) for headless rendering.
  # Tests that call HeadlessRuntime::new() will use a software adapter.
  HEADLESS_FORCE_SOFTWARE: "1"

jobs:
  # ── Fast fail ───────────────────────────────────────────────────────────────

  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Test fullscreen vs overlay harness contract
        shell: pwsh
        run: .\scripts\ci\windows\test-windowed-fullscreen-overlay-perf.ps1
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install protobuf compiler (required by tze_hud_protocol build script)
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends protobuf-compiler
      - name: cargo check (workspace)
        run: cargo check --workspace
      # Unused dependencies. Needs no build; false positives go in
      # [package.metadata.cargo-machete] ignored (with a comment saying why).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - name: cargo machete (unused dependencies)
        run: cargo machete
      - name: Test idle-efficiency artifact gate
        run: python3 scripts/ci/test_check_idle_efficiency.py
      - name: Test quiescent-efficiency startup contract
        run: python3 scripts/ci/test_run_quiescent_efficiency_script.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install protobuf compiler (required by tze_hud_protocol build script)
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends protobuf-compiler
      - name: cargo clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Windows-target clippy (cfg(windows) coverage) ──────────────────────────
  #
  # The `clippy` job above runs on ubuntu-latest, so it never compiles code
  # gated on #[cfg(target_os = "windows")] — that code is entirely invisible
  # to the Linux lint gate. hud-53s6m found a real clippy::io_other_error
  # regression in element_store.rs's Windows-only MoveFileExW path that this
  # gap let slip onto main undetected (PR #1042 fixed it).
  #
  # This job cross-compiles+lints just the crates that carry cfg(windows)
  # code, using the mingw-w64 cross toolchain (no linking/execution — clippy
  # only needs to typecheck). A workspace-wide `--workspace --target
  # x86_64-pc-windows-gnu` clippy run is NOT used here: several workspace
  # members pull in Linux-only windowing deps that do not
  # cross-compile, so this job is deliberately scoped to the three crates
  # confirmed (hud-fsfkx) to cross-compile clippy-clean:
  #   tze_hud_runtime, tze_hud_compositor, tze_hud_config
  #
  # If another crate later grows cfg(windows) code, add it to the -p list
  # below (or drop it here with a comment if it doesn't cross-compile clean).

  clippy-windows-gnu:
    name: cargo clippy (windows-gnu cross-target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install protobuf compiler + MinGW cross toolchain
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            protobuf-compiler \
            mingw-w64
      - name: cargo clippy (windows-gnu, cfg(windows) crates, deny warnings)
        run: |
          cargo clippy \
            -p tze_hud_runtime \
            -p tze_hud_compositor \
            -p tze_hud_config \
            --target x86_64-pc-windows-gnu \
            -- -D warnings

  # ── Unit and crate-level tests ───────────────────────────────────────────────
  #
  # Runs all unit and crate tests across the workspace, excluding the
  # `integration` package, whose test targets run in their own jobs
  # (test-integration below) so failures are
  # attributable per-suite.
  # The vertical_slice tests require a software GPU (llvmpipe) — HEADLESS_FORCE_SOFTWARE=1
  # is set globally in env above.

  test-unit:
    name: cargo test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [check]
    env:
      # Native Linux only; preserve Windows target linkage.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install Mesa / llvmpipe + protobuf compiler
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri \
            protobuf-compiler
      - name: cargo test (workspace, exclude integration)
        run: |
          cargo test \
            --workspace \
            --all-targets \
            --exclude integration
        env:
          # Require a GPU adapter — Mesa llvmpipe is installed above.
          # If the adapter is missing the gpu_canary test fails loudly instead
          # of silently skipping ~129 compositor GPU tests (hud-2sxfk).
          TZE_HUD_REQUIRE_GPU: "1"

  # Temporary, non-required measurement; remove before final normal readiness.
  compile-diet-measurement:
    name: frozen compile-diet comparison (temporary, non-required)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1397 && github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'agent/hud-1dnk5.2' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    env:
      PAIRED_MODE: "true"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Initialize bounded frozen-source pair
        if: env.PAIRED_MODE == 'true'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_TEMP" = /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]]
          work=$(mktemp -d "$RUNNER_TEMP/compile-diet-pair.XXXXXX"); pair="$work/evidence"; mkdir "$pair"
          printf 'PAIRED_ROOT=%s\nPAIRED_EVIDENCE=%s\nPAIRED_START=%s\n' "$work" "$pair" "$(date +%s)" >> "$GITHUB_ENV"
          printf 'setup=not-reached\nA=not-reached\nB=not-reached\n' > "$pair/status.log"
      - uses: actions/checkout@v5
        timeout-minutes: ${{ env.PAIRED_MODE == 'true' && 1 || 15 }}
        # Temporary hud-1dnk5.2 A/B/C measurement control: compare exact PR heads
        # without attributing moving merge-context source changes to the tools.
        # merge_group/push retain their actual event sha. Restore normal checkout
        # after the controlled profile/linker and runner pairs are accepted.
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: ${{ env.PAIRED_MODE == 'true' && 1 || 5 }}
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: ${{ env.PAIRED_MODE == 'true' && 1 || 15 }}
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        id: unit-cache
        timeout-minutes: ${{ env.PAIRED_MODE == 'true' && 1 || 10 }}
        # Temporary A/B/C control: lookup hits are NOT restored warm caches.
        # Keep both pairs on fresh hosted targets; restore ordinary caching only
        # after the controlled measurements, before the final normal matrix.
        with:
          lookup-only: true
          save-if: false
      - name: Install Mesa / llvmpipe + protobuf compiler
        timeout-minutes: ${{ env.PAIRED_MODE == 'true' && 1 || 5 }}
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri \
            protobuf-compiler
      - name: Measure frozen A and B on this single runner
        if: env.PAIRED_MODE == 'true'
        shell: bash
        env:
          TZE_HUD_REQUIRE_GPU: "1"
          CACHE_LOOKUP_HIT: ${{ steps.unit-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          pair=$PAIRED_EVIDENCE; work=$PAIRED_ROOT; controller=$PWD; controller_head=$(git rev-parse HEAD)
          [[ "$work" == "$RUNNER_TEMP"/compile-diet-pair.* && -d "$work" && ! -L "$work" && "$pair" == "$work/evidence" && -d "$pair" && ! -L "$pair" ]]
          deadline=$((PAIRED_START + 780)); group=; source=; evidence=$pair
          remaining() { local seconds=$((deadline - $(date +%s))); ((seconds > 0)) || return 124; printf '%s\n' "$seconds"; }
          members() { ps -e -o pid=,ppid=,pgid=,stat=,comm= | awk -v g="$group" '$3 == g' > "$evidence/process-group-last.log"; [[ -s "$evidence/process-group-last.log" ]]; }
          stop_group() {
            [[ -n "$group" ]] || return 0
            [[ "$group" =~ ^[0-9]+$ && "$group" != "$(ps -o pgid= -p $$ | tr -d ' ')" ]] || return 1
            if members; then
              kill -TERM -- "-$group" || true
              for attempt in {1..10}; do members || break; sleep 0.5; done
              if members; then kill -KILL -- "-$group" || true; sleep 1; fi
            fi
            ! members
          }
          inputs() { git ls-files -z '*.rs' '*.proto' '*.toml' Cargo.lock rust-toolchain.toml justfile scripts/dev-bootstrap.sh .github/workflows/ci.yml | sort -z | xargs -0 sha256sum; }
          close_source() {
            [[ -n "$source" ]] || return 0
            (cd "$source"; git rev-parse HEAD > "$evidence/head-after.log"; git status --porcelain --untracked-files=no > "$evidence/status-after.log"; inputs > "$evidence/source-after.sha256") || return 1
            cmp -s "$evidence/head-before.log" "$evidence/head-after.log" && [[ ! -s "$evidence/status-after.log" ]] && cmp -s "$evidence/source-before.sha256" "$evidence/source-after.sha256"
          }
          finish() {
            result=$?; trap - EXIT; set +e
            # A signal may reach this trap before the pipeline returns its PID.
            if [[ -z "$group" && -s "$evidence/process.log" ]]; then group=$(sed -n '2p' "$evidence/process.log"); fi
            stop_group; terminal=$?; ((terminal == 0)) || result=1
            if ((terminal == 0)); then
              close_source || result=1
              for frozen_leg in A B; do
                if [[ -f "$pair/initial-$frozen_leg-source.sha256" ]]; then
                  (cd "$work/source-$frozen_leg"; inputs > "$pair/final-$frozen_leg-source.sha256"; git status --porcelain --untracked-files=no > "$pair/final-$frozen_leg-status.log"; git ls-tree -r HEAD > "$pair/final-$frozen_leg-tree.log") || result=1
                  cmp -s "$pair/initial-$frozen_leg-source.sha256" "$pair/final-$frozen_leg-source.sha256" && [[ ! -s "$pair/final-$frozen_leg-status.log" ]] && cmp -s "$pair/tree-$frozen_leg.log" "$pair/final-$frozen_leg-tree.log" || result=1
                fi
              done
            fi
            [[ "$(git -C "$controller" rev-parse HEAD)" == "$controller_head" && -z "$(git -C "$controller" status --porcelain --untracked-files=no)" ]] || result=1
            printf 'controller_exit=%s\nprocess_group_terminal=%s\nelapsed_seconds=%s\n' "$result" "$terminal" "$(($(date +%s)-PAIRED_START))" >> "$pair/status.log"
            (cd "$pair"; find . -type f ! -name artifact-files.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact-files.sha256) || result=1
            exit "$result"
          }
          trap finish EXIT; trap 'exit 143' TERM INT
          remaining > "$pair/remaining-after-setup.log"
          [[ "$HEADLESS_FORCE_SOFTWARE" == 1 && "$TZE_HUD_REQUIRE_GPU" == 1 ]]
          [[ "$CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS" == '-C link-arg=-fuse-ld=mold' ]]
          if [[ "${CARGO_INCREMENTAL:-}" != 0 ]]; then printf 'rejected_override_name=CARGO_INCREMENTAL; expected_pinned_action_zero\n' >> "$pair/status.log"; exit 1; fi
          # Fail before Cargo on inherited precedence/profile/compiler uncertainty;
          # record variable NAMES, never inherited values or credential files.
          for key in $(compgen -e); do
            case "$key" in
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS|CARGO_INCREMENTAL) ;;
              RUSTFLAGS|RUSTDOCFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_ENCODED_RUSTDOCFLAGS|CARGO_BUILD_*|CARGO_TARGET_*|CARGO_PROFILE_*|RUSTC|RUSTDOC|RUSTC_WRAPPER|RUSTC_WORKSPACE_WRAPPER|CC|CXX|AR|VK_ICD_FILENAMES|TZE_HUD_PERF_ASSERT|TZE_HUD_TEST_BUDGET_SLACK|TZE_HUD_SKIP_GPU_TESTS|SKIP_GPU_TESTS|RUST_TEST_THREADS)
                printf 'rejected_override_name=%s\n' "$key" >> "$pair/status.log"; exit 1 ;;
            esac
          done
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          for file in "$cargo_home/config" "$cargo_home/config.toml"; do
            if [[ -e "$file" || -L "$file" ]]; then printf 'global_Cargo_config_present=refused\n' >> "$pair/status.log"; exit 1; fi
          done
          [[ ! -e "$controller/target" && ! -L "$controller/target" ]]
          # Upload ONLY small evidence; disposable source/compiled targets are siblings.
          {
            date -u; printf 'controller_head=%s\ncontroller_tree=%s\nrun_id=%s\nattempt=%s\nevent=%s\njob=%s\n' "$controller_head" "$(git rev-parse HEAD^{tree})" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_JOB"
            printf 'image=%s/%s\nrunner=%s/%s\ncache_lookup_hit=%s\nlookup_only=true\nsave=false\norder=A-then-B\nshared_deadline=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_OS" "$RUNNER_ARCH" "${CACHE_LOOKUP_HIT:-unknown}" "$deadline"
            printf 'expected_pinned_shared_CARGO_INCREMENTAL=0\n'
            uname -srm; lscpu; rustc --version --verbose; cargo --version; protoc --version
            cc --version | sed -n '1p'; ld --version | sed -n '1p'; mold --version; /usr/bin/time --version | sed -n '1p'; timeout --version | sed -n '1p'
            sha256sum .github/workflows/ci.yml .cargo/config.toml
          } > "$pair/context.log"
          rustc --version | grep -E '^rustc 1\.88\.0 '; mold --version | grep -E '^mold 2\.42\.1 '
          printf 'timed_wrapper=time+timeout+launcher+awk; same_both_legs; not_isolated_compiler_or_linker_CPU\n' >> "$pair/context.log"
          A=268033bbb7e3a390961619843c8a525a4d6c322b; B=589e8b33bcac332b577ec6b449bca22a8140be74
          timeout --signal=TERM --kill-after=5s "$(remaining)s" git fetch --no-tags origin "$A" "$B" > "$pair/fetch-refs.log" 2>&1
          [[ "$(git rev-parse "$A^{commit}")" == "$A" && "$(git rev-parse "$B^{commit}")" == "$B" && "$(git rev-parse "$B^")" == "$A" ]]
          [[ "$(git rev-parse "$A^{tree}")" == 55db8ce1eeeb92605e67545f3b8acbe6bdce9fb8 && "$(git rev-parse "$B^{tree}")" == bb03991326d6fb517e2fbd416907bad7e0afd70e ]]
          git diff --name-only "$A" "$B" > "$pair/A-B-owner-differences.log"
          printf '.github/workflows/ci.yml\nCargo.toml\njustfile\nscripts/dev-bootstrap.sh\n' | cmp - "$pair/A-B-owner-differences.log"
          mkdir "$work/empty-hooks"
          for leg in A B; do
            timeout --signal=TERM --kill-after=5s "$(remaining)s" git -c core.hooksPath="$work/empty-hooks" worktree add --detach "$work/source-$leg" "${!leg}" >> "$pair/worktrees.log" 2>&1
            [[ ! -e "$work/target-$leg" && ! -L "$work/target-$leg" ]]
            directory="$work/source-$leg"
            [[ "$(sha256sum "$directory/.cargo/config.toml" | cut -d' ' -f1)" == 2842d5787c401050529a4fece3ebff5510166212952f93d0f1ed5e16c130f038 ]]
            [[ ! -e "$directory/.cargo/config" && ! -L "$directory/.cargo/config" ]]
            while [[ "$directory" != / ]]; do
              directory=$(dirname "$directory")
              for file in "$directory/.cargo/config" "$directory/.cargo/config.toml"; do [[ ! -e "$file" && ! -L "$file" ]] || { printf 'ancestor_Cargo_config_present=refused\n' >> "$pair/status.log"; exit 1; }; done
            done
            (cd "$work/source-$leg"; git ls-tree -r HEAD; git status --porcelain --untracked-files=no) > "$pair/tree-$leg.log"
            (cd "$work/source-$leg"; [[ -z "$(git status --porcelain --untracked-files=no)" ]]; inputs) > "$pair/initial-$leg-source.sha256"
          done
          cmp "$work/source-A/Cargo.lock" "$work/source-B/Cargo.lock"
          common_limit=$(remaining); ((common_limit <= 60)) || common_limit=60
          set +e
          (cd "$work/source-A"; env -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS CARGO_TARGET_DIR="$work/fetch-only" /usr/bin/time -p -o "$pair/common-fetch-time.log" timeout --signal=TERM --kill-after=5s "${common_limit}s" cargo fetch --locked --target x86_64-unknown-linux-gnu) > "$pair/common-fetch.log" 2>&1
          fetch_exit=$?; set -e; printf 'common_fetch_exit=%s\n' "$fetch_exit" >> "$pair/status.log"
          ((fetch_exit == 0)) || exit "$fetch_exit"
          [[ ! -e "$work/target-A" && ! -L "$work/target-A" && ! -e "$work/target-B" && ! -L "$work/target-B" ]]
          for leg in A B; do
            source="$work/source-$leg"; evidence="$pair/$leg"; mkdir "$evidence"; cd "$source"
            [[ "$(git rev-parse HEAD)" == "${!leg}" && -z "$(git status --porcelain --untracked-files=no)" && ! -e "$work/target-$leg" ]]
            git rev-parse HEAD > "$evidence/head-before.log"; inputs > "$evidence/source-before.sha256"
            export CARGO_TARGET_DIR="$work/target-$leg"
            if [[ "$leg" == A ]]; then unset CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS; else export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS='-C link-arg=-fuse-ld=mold'; fi
            printf 'leg=%s\ncwd=%s\ntarget=%s\ntarget_before=absent\nGPU_required=1\nsoftware=1\nPERF_SKIP_slack_VK=unset\ncargo_argv=cargo test --workspace --all-targets --exclude integration\n' "$leg" "$PWD" "$CARGO_TARGET_DIR" > "$evidence/context.log"
            if [[ "$leg" == B ]]; then printf '%s' "$CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS" | sha256sum >> "$evidence/context.log"; else printf 'native_rustflag=unset\n' >> "$evidence/context.log"; fi
            limit=$(remaining); printf '%s=started remaining=%s\n' "$leg" "$limit" >> "$pair/status.log"
            set +e
            /usr/bin/time -p -o "$evidence/command-time.log" timeout --signal=TERM --kill-after=5s "${limit}s" bash -c 'printf "%s\n%s\n" "$BASHPID" "$(ps -o pgid= -p "$BASHPID" | tr -d " ")" > "$1/process.log"; exec cargo test --workspace --all-targets --exclude integration' _ "$evidence" 2>&1 \
              | awk -v raw="$evidence/cargo-test.log" -v stamped="$evidence/timestamped-output.log" -v phases="$evidence/output-phases.log" '
                { epoch=systime(); print; print $0 >> raw; print epoch "\t" $0 >> stamped; plain=$0; gsub(/\033\[[0-9;]*[[:alpha:]]/, "", plain);
                  if(plain ~ /Finished .*target\(s\) in/) finished=plain; if(plain ~ /Running / && first=="") first=epoch; last=epoch; fflush(); }
                END { if(finished!="") print "cargo_finished_line=" finished > phases; else print "cargo_compile_completion=not-reached" > phases;
                  if(first!="") { print "first_running_epoch_seconds=" first >> phases; print "last_output_epoch_seconds=" last >> phases; print "execution_output_span_seconds=" last-first >> phases; } else print "test_execution=not-reached" >> phases; }'
            pipeline=("${PIPESTATUS[@]}"); set -e
            printf 'cargo_time_timeout_exit=%s\nlogger_exit=%s\n' "${pipeline[0]}" "${pipeline[1]}" > "$evidence/exit.log"
            [[ -s "$evidence/process.log" ]] || { printf 'timed_process_identity=missing; STOP\n' >> "$pair/status.log"; exit 1; }
            group=$(sed -n '2p' "$evidence/process.log")
            [[ "$group" =~ ^[0-9]+$ ]] || exit 1
            if members; then printf 'unexpected_live_timed_group_after_wait=STOP\n' >> "$pair/status.log"; exit 1; fi
            stop_group; printf 'process_group_terminal=true\n' >> "$evidence/exit.log"; group=
            close_source; printf 'source_before_after=equal\n' >> "$evidence/exit.log"; source=
            awk '{plain=$0; gsub(/\033\[[0-9;]*[[:alpha:]]/, "", plain); if(plain ~ /Updating|Downloading|Downloaded|index|network/) print NR "\t" plain}' "$evidence/cargo-test.log" > "$evidence/timed-network-index-diagnostics.log"
            wc -l "$evidence/timed-network-index-diagnostics.log" > "$evidence/timed-network-index-diagnostic-count.log"
            printf 'absence_of_diagnostics_NOT_zero_network_IO; fixed_order_shared_OS_registry_single_pair_NOT_pure_linker_CPU\n' >> "$evidence/context.log"
            find "$CARGO_TARGET_DIR" -type f | wc -l > "$evidence/target-files-after.log"; du -sk "$CARGO_TARGET_DIR" > "$evidence/target-KiB-after.log"
            printf '%s=cargo_exit:%s logger_exit:%s\n' "$leg" "${pipeline[0]}" "${pipeline[1]}" >> "$pair/status.log"
            ((pipeline[0] == 0)) || exit "${pipeline[0]}"; ((pipeline[1] == 0)) || exit "${pipeline[1]}"
            remaining > "$evidence/remaining-after-terminal.log"
          done
          cd "$controller"; printf 'pair=complete; treatment=profiles_plus_mold; interpretation=single_fixed_order_bundled_observation\n' >> "$pair/status.log"
      - name: Upload controlled test-unit measurement
        timeout-minutes: ${{ env.PAIRED_MODE == 'true' && 1 || 15 }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-diet-fixed-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PAIRED_MODE == 'true' && env.PAIRED_EVIDENCE || 'test_results/compile-diet/unit/' }}
          # Setup failures remain real failures even when no measurement began.
          if-no-files-found: warn

  # ── Integration: headless multi-crate suites ───────────────────────────────
  #
  # Runs the `integration` package's test targets that are fast and headless
  # (HeadlessRuntime + software GPU via HEADLESS_FORCE_SOFTWARE=1; no display
  # server required).
  # `just test-integration` runs the same `--tests` command.

  test-integration:
    name: cargo test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install Mesa / llvmpipe + protobuf compiler
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri \
            protobuf-compiler
      - name: cargo test -p integration (headless suites)
        run: |
          cargo test -p integration --tests
      - name: Test token-footprint gate contract
        run: >-
          python3 -m unittest
          scripts.ci.test_check_token_footprint
          scripts.ci.test_token_footprint_flow
      - name: Calibrate deterministic LLM-facing token footprint
        env:
          HEADLESS_FORCE_SOFTWARE: "1"
        run: |
          mkdir -p test_results/token-footprint
          cargo run -p benchmark --features headless \
            --bin token_footprint_calibration -- \
            --output test_results/token-footprint/measurement.json
          cargo run -p benchmark --features headless \
            --bin token_footprint_calibration -- \
            --output test_results/token-footprint/repeat.json
          cmp test_results/token-footprint/measurement.json \
            test_results/token-footprint/repeat.json
          python3 scripts/ci/check_token_footprint.py \
            --measurement test_results/token-footprint/measurement.json \
            --baseline scripts/ci/token_footprint_baseline.json \
            --output test_results/token-footprint/gate-report.json
      - name: Upload token-footprint calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-footprint-calibration
          path: test_results/token-footprint/
          if-no-files-found: error

  # ── Example production config boot (vertical_slice) ────────────────────────
  #
  # Boots the runtime with the example's committed production config
  # (examples/vertical_slice/config/production.toml) and its paired agents
  # (agents.toml). If either file is malformed or governance config parsing
  # regresses, this fails.
  #
  # The test lives at examples/vertical_slice/tests/production_boot.rs: it
  # builds HeadlessRuntime from the config and asserts startup succeeds, with
  # no dev-mode. The unpaired-PSK gate lives in tze_hud_app's production_boot,
  # and the full agent lifecycle in the vertical_slice binary's own tests.

  production-boot-vertical-slice:
    name: vertical_slice production config boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install Mesa / llvmpipe + protobuf compiler
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri \
            protobuf-compiler
      - name: cargo test -p vertical_slice --test production_boot
        run: |
          cargo test \
            -p vertical_slice \
            --test production_boot \
            -- --nocapture

  # ── Canonical app production config boot gate ───────────────────────────────
  #
  # Boots the runtime with the committed canonical app config:
  #   app/tze_hud_app/config/production.toml
  #
  # This gate must fail when startup silently falls back to default/headless
  # behavior. The backing test asserts config-declared widget instances/types and
  # profile-driven zone policy are present, not just that runtime construction
  # returns Ok.

  canonical-app-production-boot:
    name: canonical app production config boot gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install Mesa / llvmpipe + protobuf compiler
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri \
            protobuf-compiler
      - name: cargo test -p tze_hud_app --test production_boot
        run: |
          cargo test \
            -p tze_hud_app \
            --test production_boot \
            -- --nocapture

  # ── User-test Python suite ──────────────────────────────────────────────────
  #
  # Runs the pure-Python unit tests under .claude/skills/user-test/{tests,scripts}/.
  # Previously this suite only ran interactively via the user-test skill, so
  # drift went undetected until a worker tripped over it (hud-43z24).
  #
  # Scope is limited to files verified hermetic by reading + running locally:
  # no GPU, no Windows, no live HUD runtime, no external network.
  #   - tests/ (presence card, portal client, projection adoption docs)
  #   - scripts/test_hud_grpc_client.py (needs the packages installed below;
  #     without the `blake3` package it falls back to compiling a tiny cargo
  #     helper on the fly — a hidden crates.io network dependency — so
  #     installing the `blake3` wheel here keeps this job fully pip-hermetic)
  #
  # Excluded: scripts/stress_test_zones.py, publish_widget_batch.py,
  # publish_zone_batch.py and the other *_exemplar.py scripts under scripts/ —
  # these are live-HUD-runtime CLI tools (gRPC session against a running
  # resident), not unit-test suites, and have no test_*.py counterpart here.

  user-test-python-suite:
    name: user-test python suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: |
          pip install --quiet -r scripts/requirements-dev.txt
      - name: Run pure-Python user-test suite
        run: |
          python3 -m pytest \
            .claude/skills/user-test/tests/ \
            .claude/skills/user-test/scripts/test_hud_grpc_client.py \
            scripts/tests/ \
            -q
      - name: Run scripts/ci unit tests
        run: python3 -m unittest discover -s scripts/ci

  # ── Dev-mode guard ──────────────────────────────────────────────────────────
  #
  # Verifies that `dev-mode` is not enabled by a default build of any workspace
  # package, including the tze_hud_app release binary's whole dependency closure
  # (feature edges and indirection included; scripts/ci/check_dev_mode_defaults.py).
  # This is a Cargo metadata check only; the real release build runs in windows.yml.
  # `just dev-mode-guard` runs the same command.

  dev-mode-guard:
    name: dev-mode guard (release build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - name: Verify dev-mode is not a default feature
        run: cargo metadata --format-version 1 --no-deps | python3 scripts/ci/check_dev_mode_defaults.py

  # ── Dependency security + license audit (cargo-deny) ──────────────────────
  #
  # Runs cargo-deny to check:
  #   - advisories: known CVEs and unmaintained crates (RUSTSEC database)
  #   - licenses: all dependencies must be GPL-3.0 compatible per deny.toml
  #
  # This job does NOT require compilation — cargo-deny reads Cargo.lock and
  # crate metadata only.  It runs against the same Rust toolchain as the rest
  # of CI so that workspace metadata resolution is consistent.
  #
  # Advisory waivers and license allowances are documented with rationale in
  # deny.toml at the repository root.  See hud-1aswu.5 for context.
  #
  # Uses EmbarkStudios/cargo-deny-action for a stable, versioned install.
  # The current @v2 reference is a version tag, not a commit SHA.

  cargo-deny:
    name: cargo deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: cargo deny check advisories + licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Explicitly check all four gates: advisories, licenses, bans and sources.
          command: check advisories licenses bans sources
          # Log level: warn surfaces yanked-crate and duplicate-version notices
          # without failing the job.
          log-level: warn

  # ── GPU pixel readback (informational) ────────────────────────────────────────────
  #
  # Runs the pixel readback integration tests that validate the full GPU
  # compositing pipeline (Layer 1 colour assertions).  These require either:
  # - A real GPU (hardware CI runner), or
  # - Mesa llvmpipe (software Vulkan, available on Linux)
  #
  # On GitHub-hosted runners, llvmpipe is available via mesa-vulkan-drivers
  # but performance is much slower.  Pixel assertions use a wider tolerance
  # in CI (configured via the LLVMPIPE_CI env var in the test harness).
  #
  # To run locally:
  #   just test-gpu
  #
  # This job is INFORMATIONAL only on PRs and does not block merge. It is a
  # pure duplicate: the workspace-wide `cargo test` in test-unit (a required
  # check) already builds and runs pixel_readback, because workspace feature
  # unification enables tze_hud_runtime/dev-mode. Making this job blocking would
  # add nothing; see bead hud-bstmy.8.6 for its disposition.

  test-gpu-pixel-readback:
    name: pixel readback (GPU / llvmpipe, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-unit]
    continue-on-error: true  # informational duplicate of test-unit coverage; see comment above
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
      - name: Install Mesa / llvmpipe + Vulkan loader + protobuf compiler
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri \
            vulkan-tools \
            protobuf-compiler
      - name: Verify Vulkan adapter available
        run: vulkaninfo --summary 2>&1 | head -30 || true
      - name: cargo test pixel_readback (software GPU)
        run: |
          cargo test \
            -p tze_hud_runtime \
            --test pixel_readback \
            --features dev-mode \
            -- --nocapture
        env:
          HEADLESS_FORCE_SOFTWARE: "1"
          LLVMPIPE_CI: "1"
          # Canary: fail loudly if the adapter is missing instead of silently
          # skipping GPU tests (hud-2sxfk).
          TZE_HUD_REQUIRE_GPU: "1"
