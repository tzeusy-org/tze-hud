# tze_hud CI — merge gates.
#
# Required checks must finish within 6 minutes of a merge-group run starting
# and pass on the first attempt (docs/scope.md "Merge gate and testability").
# Anything slower goes in the weekly lanes (perf-budget.yml, perf-assert.yml).
# Every job has a job-level timeout-minutes and every apt step has its own, so
# a stalled runner or mirror fails fast instead of timing out the merge queue.
#
# Three jobs, by design. Every job pays ~30–60 s of runner setup (toolchain,
# cache restore, apt) and holds one slot of the org's shared hosted-runner
# pool. With nine jobs per run, PR pushes, up to three merge-group builds and
# main pushes queued 4–15 min for runners while each job ran ≤3.3 min
# (2026-11-01 measurement). Fewer, fuller jobs keep the wall time near the
# run time. Add a step to an existing job before adding a job.
#
# Required checks (ruleset "main merge queue"; job `name:`s must not change):
#   static checks, cargo clippy, cargo test
#
# Job map:
#   static  — no Rust compilation:
#             evidence roots untracked, no host identifiers in tracked
#             files, cargo fmt --check, locked metadata,
#             dev-mode guard (default-build closure of every package),
#             cargo machete (unused deps), cargo deny licenses/bans/sources,
#             cargo deny advisories (advisory on PR/queue, fatal on main push:
#             a new RUSTSEC entry must not block unrelated merges),
#             pure-Python suites (user-test skill, scripts/tests, scripts/ci)
#   clippy  — workspace all-targets + benchmark/headless, -D warnings (subsumes
#             cargo check), then the cfg(windows) crates on the windows-gnu
#             cross-target, which the Linux pass never compiles
#   test    — pinned cargo nextest over the workspace minus `integration`
#             with tze_hud_runtime/dev-mode (incl. production_boot suites and
#             runtime pixel_readback), then cargo test -p integration --tests,
#             then the deterministic LLM-facing token-footprint gate
#
# GPU steps run with HEADLESS_FORCE_SOFTWARE=1 (llvmpipe on Linux) so no
# hardware GPU is needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: required checks must also run on the queue's temporary
  # `gh-readonly-queue/main/*` branches, or queued PRs never become mergeable.
  merge_group:

# A new push to a PR supersedes its running checks; queue and main runs finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # apt retries and network timeouts: a stalled mirror fails fast instead of
  # hanging the job (a 51-minute mingw-w64 install once timed out the merge queue).
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Force software GPU (llvmpipe on Linux, WARP on Windows) for headless rendering.
  # Tests that call HeadlessRuntime::new() will use a software adapter.
  HEADLESS_FORCE_SOFTWARE: "1"

jobs:
  # ── Static: no compilation ──────────────────────────────────────────────────
  #
  # The Python suites are pure-Python and hermetic: no GPU, Windows, live HUD
  # runtime or network. Live-HUD CLI tools under the user-test skill's
  # scripts/ (stress_test_zones.py, publish_*_batch.py, *_exemplar.py) are not
  # test suites and stay out.

  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check evidence roots are untracked
        run: bash scripts/ci/check_untracked_evidence.sh
      - name: Check tracked files carry no host identifiers
        run: python3 scripts/ci/check_host_identifiers.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: dev-mode guard (default-build closure)
        run: cargo metadata --format-version 1 --no-deps | python3 scripts/ci/check_dev_mode_defaults.py
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      # False positives go in [package.metadata.cargo-machete] ignored, with a reason.
      - name: cargo machete (unused dependencies)
        run: cargo machete
      # Waivers and license allowances are documented in deny.toml.
      - name: cargo deny (licenses, bans, sources)
        run: cargo deny --log-level warn check licenses bans sources
      - name: cargo deny (advisories)
        continue-on-error: ${{ github.event_name != 'push' }}
        run: cargo deny --log-level warn check advisories
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: pip install --quiet -r scripts/requirements-dev.txt
      - name: Pure-Python suites (user-test skill, scripts/tests)
        run: |
          python3 -m pytest \
            .claude/skills/user-test/tests/ \
            scripts/tests/ \
            -q
      # Includes the idle-efficiency, quiescent-startup and token-footprint
      # gate contract tests (scripts/ci/test_*.py).
      - name: scripts/ci unit tests
        run: python3 -m unittest discover -s scripts/ci

  # ── Lint: Linux all-targets, then the cfg(windows) crates ──────────────────
  #
  # The Linux pass never compiles #[cfg(target_os = "windows")] code;
  # hud-53s6m found a real clippy::io_other_error regression in
  # element_store.rs's Windows-only MoveFileExW path that slipped through that
  # gap (PR #1042). The cross-target pass typechecks only (blake3's portable
  # backend, no MinGW, no linking) and is scoped to the crates confirmed
  # (hud-fsfkx) to cross-compile clippy-clean: tze_hud_runtime,
  # tze_hud_compositor, tze_hud_config. Several workspace members pull in
  # Linux-only windowing deps, so `--workspace --target …-windows-gnu` is not
  # used. A crate that grows cfg(windows) code joins the -p list.

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
          targets: x86_64-pc-windows-gnu
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --features benchmark/headless -- -D warnings
      - name: cargo clippy (windows-gnu, cfg(windows) crates, deny warnings)
        env:
          # Lint only; real Windows builds retain their compiler/hash backend.
          CARGO_FEATURE_PURE: "1"
        run: |
          cargo clippy \
            -p tze_hud_runtime \
            -p tze_hud_compositor \
            -p tze_hud_config \
            --target x86_64-pc-windows-gnu \
            -- -D warnings

  # ── Tests: workspace (nextest), integration, token footprint ───────────────
  #
  # The workspace pass excludes the `integration` package, whose headless
  # suites (HeadlessRuntime + software GPU; no display server) run in their
  # own step so a failure is attributable per suite. `just test` and
  # `just test-integration` run the same commands.

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # Native Linux only; preserve Windows target linkage.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Mesa / llvmpipe
        timeout-minutes: 5
        run: |
          # Remove only the observed Azure HTTP route; keep signed HTTPS fallbacks.
          # An unsupported hosted image layout must fail before package acquisition.
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          test -f "$apt_mirror_list"
          test ! -L "$apt_mirror_list"
          grep -Eq '^https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' "$apt_mirror_list"
          grep -Eq '^https://security[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' "$apt_mirror_list"
          sudo sed -Ei '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/?([[:space:]].*)?$|d' "$apt_mirror_list"
          sudo apt-get $APT_OPTS update -q --error-on=any
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri
      - name: Install pinned Nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        timeout-minutes: 2
        with:
          tool: cargo-nextest@0.9.114
          checksum: true
          fallback: none
      - name: cargo nextest (workspace, exclude integration)
        shell: bash
        run: |
          set -euo pipefail
          evidence=test_results/compile-diet/nextest
          mkdir -p "$evidence"
          inputs() { git ls-files -z '*.rs' '*.proto' '*.toml' Cargo.lock rust-toolchain.toml justfile scripts/dev-bootstrap.sh .github/workflows/ci.yml | sort -z | xargs -0 sha256sum; }
          finish() {
            status=$?; trap - EXIT
            inputs > "$evidence/source-after.sha256" || status=1
            cmp -s "$evidence/source-before.sha256" "$evidence/source-after.sha256" || status=1
            printf 'command_exit=%s\nfinished_utc=%s\n' "$status" "$(date -u +%FT%TZ)" > "$evidence/terminal.log"
            ps -e -o pid,ppid,pgid,stat,comm > "$evidence/processes-after.log"
            exit "$status"
          }
          inputs > "$evidence/source-before.sha256"
          trap finish EXIT
          git rev-parse HEAD > "$evidence/checkout-head.txt"
          git ls-tree -r HEAD > "$evidence/checkout-tree.txt"
          for control in SKIP_GPU_TESTS TZE_HUD_SKIP_GPU_TESTS RUST_TEST_THREADS NEXTEST_RETRIES NEXTEST_TEST_THREADS NEXTEST_PROFILE TZE_HUD_PERF_ASSERT TZE_HUD_TEST_BUDGET_SLACK; do
            if [[ -v "$control" ]]; then printf 'unexpected control: %s\n' "$control" >&2; exit 1; fi
          done
          cargo nextest --version | tee "$evidence/nextest-version.txt"
          grep -Eq '^cargo-nextest 0\.9\.114([[:space:]]|$)' "$evidence/nextest-version.txt"
          rustc -vV > "$evidence/rustc-version.txt"
          cargo --version > "$evidence/cargo-version.txt"
          mold --version > "$evidence/mold-version.txt"
          if [[ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          elif [[ -f /usr/share/vulkan/icd.d/lvp_icd.json ]]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          else
            echo 'required llvmpipe ICD is missing' >&2; exit 1
          fi
          printf 'started_utc=%s\nHEADLESS_FORCE_SOFTWARE=1\nTZE_HUD_REQUIRE_GPU=1\nprofile=default\nCPU_threads=default\n' "$(date -u +%FT%TZ)" > "$evidence/context.log"
          cargo nextest list --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode --list-type binaries-only --message-format json > "$evidence/binaries.json" 2> "$evidence/binaries.stderr"
          cargo nextest list --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode --message-format json > "$evidence/tests.json" 2> "$evidence/tests.stderr"
          cargo nextest show-config test-groups --show-default --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode > "$evidence/groups.txt" 2> "$evidence/groups.stderr"
          ps -e -o pid,ppid,pgid,stat,comm > "$evidence/processes-before.log"
          set +e
          /usr/bin/time -v -o "$evidence/run-time.txt" \
            cargo nextest run --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode \
            2>&1 | tee "$evidence/run.log"
          outcomes=("${PIPESTATUS[@]}")
          set -e
          printf 'timed_runner_exit=%s\nlogger_exit=%s\n' "${outcomes[0]}" "${outcomes[1]}" > "$evidence/run-exits.log"
          ((outcomes[1] == 0)) || exit "${outcomes[1]}"
          exit "${outcomes[0]}"
        env:
          # Missing GPU setup is a real failure; the ONE Nextest GPU group
          # coordinates separate test processes, unlike in-process test locks.
          TZE_HUD_REQUIRE_GPU: "1"
      - name: Upload Nextest unit evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: nextest-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test_results/compile-diet/nextest/
            target/nextest/default/junit.xml
          if-no-files-found: warn
      - name: cargo test -p integration (headless suites)
        run: |
          cargo test -p integration --tests
      - name: Calibrate deterministic LLM-facing token footprint
        env:
          HEADLESS_FORCE_SOFTWARE: "1"
        run: |
          mkdir -p test_results/token-footprint
          # Three calibration parents use plain scenes/HTTP, without GPU init.
          cargo test -p benchmark --features headless --bin token_footprint_calibration
          cargo run -p benchmark --features headless \
            --bin token_footprint_calibration -- \
            --output test_results/token-footprint/measurement.json
          cargo run -p benchmark --features headless \
            --bin token_footprint_calibration -- \
            --output test_results/token-footprint/repeat.json
          cmp test_results/token-footprint/measurement.json \
            test_results/token-footprint/repeat.json
          python3 scripts/ci/check_token_footprint.py \
            --measurement test_results/token-footprint/measurement.json \
            --baseline scripts/ci/token_footprint_baseline.json \
            --output test_results/token-footprint/gate-report.json
      - name: Upload token-footprint calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-footprint-calibration
          path: test_results/token-footprint/
          if-no-files-found: error
