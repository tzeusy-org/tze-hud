# tze_hud CI — merge gates.
#
# Required checks must finish within 6 minutes of a merge-group run starting
# and pass on the first attempt (docs/scope.md "Merge gate and testability").
# Anything slower goes in the weekly lanes (perf-budget.yml, perf-assert.yml).
# Every job has a job-level timeout-minutes and every apt step has its own, so
# a stalled runner or mirror fails fast instead of timing out the merge queue.
#
# Required checks (ruleset "main merge queue"; job `name:`s must not change):
#   cargo check, cargo fmt, cargo clippy, cargo test (unit),
#   cargo test (integration), dev-mode guard (release build),
#   cargo clippy (windows-gnu cross-target)
#
# Job map:
#   check          — cargo check: fast compilation gate (no codegen)
#                    + cargo machete (unused dependencies)
#                    + fail-closed idle-efficiency checker contract tests
#   fmt            — cargo fmt --check
#   clippy         — cargo clippy --all-targets -D warnings (incl. tests/examples/benches)
#   clippy-windows-gnu — cargo clippy --target x86_64-pc-windows-gnu -D warnings on the
#     crates carrying cfg(windows) code, which the Linux clippy job never compiles
#   test-unit      — pinned cargo nextest run --workspace --all-targets --exclude integration
#                    --features tze_hud_runtime/dev-mode (required check name unchanged)
#   test-integration — cargo test -p integration --tests
#                    + deterministic LLM-facing token-footprint gate
#   test-unit also runs both production_boot suites and runtime pixel_readback;
#     the focused local boot/GPU recipes remain available
#   user-test-python-suite — pytest over the user-test and repo script suites;
#     pure-Python tests only, with no GPU, Windows, live HUD runtime, or network
#   dev-mode-guard — cargo-metadata check (no build) that dev-mode is not enabled in the
#     default-build dependency closure of any workspace package, incl. the shipped
#     binary (the actual release build runs in windows.yml)
#   cargo-deny     — advisories + licenses + bans + sources (workflow-blocking;
#     outside the current seven required checks)
#
# GPU jobs run with HEADLESS_FORCE_SOFTWARE=1 (llvmpipe on Linux) so no
# hardware GPU is needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: required checks must also run on the queue's temporary
  # `gh-readonly-queue/main/*` branches, or queued PRs never become mergeable.
  merge_group:

env:
  # apt retries and network timeouts: a stalled mirror fails fast instead of
  # hanging the job (a 51-minute mingw-w64 install once timed out the merge queue).
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Force software GPU (llvmpipe on Linux, WARP on Windows) for headless rendering.
  # Tests that call HeadlessRuntime::new() will use a software adapter.
  HEADLESS_FORCE_SOFTWARE: "1"

jobs:
  # ── Fast fail ───────────────────────────────────────────────────────────────

  check:
    name: cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: cargo check (workspace)
        run: cargo check --workspace
      # Unused dependencies. Needs no build; false positives go in
      # [package.metadata.cargo-machete] ignored (with a comment saying why).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - name: cargo machete (unused dependencies)
        run: cargo machete
      - name: Test idle-efficiency artifact gate
        run: python3 scripts/ci/test_check_idle_efficiency.py
      - name: Test quiescent-efficiency startup contract
        run: python3 scripts/ci/test_run_quiescent_efficiency_script.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check evidence roots are untracked
        run: bash scripts/ci/check_untracked_evidence.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Windows-target clippy (cfg(windows) coverage) ──────────────────────────
  #
  # The `clippy` job above runs on ubuntu-24.04, so it never compiles code
  # gated on #[cfg(target_os = "windows")] — that code is entirely invisible
  # to the Linux lint gate. hud-53s6m found a real clippy::io_other_error
  # regression in element_store.rs's Windows-only MoveFileExW path that this
  # gap let slip onto main undetected (PR #1042 fixed it).
  #
  # This job cross-compiles+lints just the crates that carry cfg(windows)
  # code, using blake3's portable Rust backend without MinGW (no linking or
  # execution — clippy only needs to typecheck). A workspace-wide `--workspace --target
  # x86_64-pc-windows-gnu` clippy run is NOT used here: several workspace
  # members pull in Linux-only windowing deps that do not
  # cross-compile, so this job is deliberately scoped to the three crates
  # confirmed (hud-fsfkx) to cross-compile clippy-clean:
  #   tze_hud_runtime, tze_hud_compositor, tze_hud_config
  #
  # If another crate later grows cfg(windows) code, add it to the -p list
  # below (or drop it here with a comment if it doesn't cross-compile clean).

  clippy-windows-gnu:
    name: cargo clippy (windows-gnu cross-target)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy (windows-gnu, cfg(windows) crates, deny warnings)
        env:
          # Lint only; real Windows builds retain their compiler/hash backend.
          CARGO_FEATURE_PURE: "1"
        run: |
          cargo clippy \
            -p tze_hud_runtime \
            -p tze_hud_compositor \
            -p tze_hud_config \
            --target x86_64-pc-windows-gnu \
            -- -D warnings

  # ── Unit and crate-level tests ───────────────────────────────────────────────
  #
  # Runs all unit and crate tests across the workspace, excluding the
  # `integration` package, whose test targets run in their own jobs
  # (test-integration below) so failures are
  # attributable per-suite.
  # The vertical_slice tests require a software GPU (llvmpipe) — HEADLESS_FORCE_SOFTWARE=1
  # is set globally in env above.

  test-unit:
    name: cargo test (unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      # Native Linux only; preserve Windows target linkage.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Mesa / llvmpipe
        timeout-minutes: 5
        run: |
          # Remove only the observed Azure HTTP route; keep signed HTTPS fallbacks.
          # An unsupported hosted image layout must fail before package acquisition.
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          test -f "$apt_mirror_list"
          test ! -L "$apt_mirror_list"
          grep -Eq '^https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' "$apt_mirror_list"
          grep -Eq '^https://security[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' "$apt_mirror_list"
          sudo sed -Ei '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/?([[:space:]].*)?$|d' "$apt_mirror_list"
          sudo apt-get $APT_OPTS update -q --error-on=any
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri
      - name: Install pinned Nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        timeout-minutes: 2
        with:
          tool: cargo-nextest@0.9.114
          checksum: true
          fallback: none
      - name: cargo nextest (workspace, exclude integration)
        shell: bash
        run: |
          set -euo pipefail
          evidence=test_results/compile-diet/nextest
          mkdir -p "$evidence"
          inputs() { git ls-files -z '*.rs' '*.proto' '*.toml' Cargo.lock rust-toolchain.toml justfile scripts/dev-bootstrap.sh .github/workflows/ci.yml | sort -z | xargs -0 sha256sum; }
          finish() {
            status=$?; trap - EXIT
            inputs > "$evidence/source-after.sha256" || status=1
            cmp -s "$evidence/source-before.sha256" "$evidence/source-after.sha256" || status=1
            printf 'command_exit=%s\nfinished_utc=%s\n' "$status" "$(date -u +%FT%TZ)" > "$evidence/terminal.log"
            ps -e -o pid,ppid,pgid,stat,comm > "$evidence/processes-after.log"
            exit "$status"
          }
          inputs > "$evidence/source-before.sha256"
          trap finish EXIT
          git rev-parse HEAD > "$evidence/checkout-head.txt"
          git ls-tree -r HEAD > "$evidence/checkout-tree.txt"
          for control in SKIP_GPU_TESTS TZE_HUD_SKIP_GPU_TESTS RUST_TEST_THREADS NEXTEST_RETRIES NEXTEST_TEST_THREADS NEXTEST_PROFILE TZE_HUD_PERF_ASSERT TZE_HUD_TEST_BUDGET_SLACK; do
            if [[ -v "$control" ]]; then printf 'unexpected control: %s\n' "$control" >&2; exit 1; fi
          done
          cargo nextest --version | tee "$evidence/nextest-version.txt"
          grep -Eq '^cargo-nextest 0\.9\.114([[:space:]]|$)' "$evidence/nextest-version.txt"
          rustc -vV > "$evidence/rustc-version.txt"
          cargo --version > "$evidence/cargo-version.txt"
          mold --version > "$evidence/mold-version.txt"
          if [[ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          elif [[ -f /usr/share/vulkan/icd.d/lvp_icd.json ]]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          else
            echo 'required llvmpipe ICD is missing' >&2; exit 1
          fi
          printf 'started_utc=%s\nHEADLESS_FORCE_SOFTWARE=1\nTZE_HUD_REQUIRE_GPU=1\nprofile=default\nCPU_threads=default\n' "$(date -u +%FT%TZ)" > "$evidence/context.log"
          cargo nextest list --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode --list-type binaries-only --message-format json > "$evidence/binaries.json" 2> "$evidence/binaries.stderr"
          cargo nextest list --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode --message-format json > "$evidence/tests.json" 2> "$evidence/tests.stderr"
          cargo nextest show-config test-groups --show-default --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode > "$evidence/groups.txt" 2> "$evidence/groups.stderr"
          ps -e -o pid,ppid,pgid,stat,comm > "$evidence/processes-before.log"
          set +e
          /usr/bin/time -v -o "$evidence/run-time.txt" \
            cargo nextest run --workspace --all-targets --exclude integration --features tze_hud_runtime/dev-mode \
            2>&1 | tee "$evidence/run.log"
          outcomes=("${PIPESTATUS[@]}")
          set -e
          printf 'timed_runner_exit=%s\nlogger_exit=%s\n' "${outcomes[0]}" "${outcomes[1]}" > "$evidence/run-exits.log"
          ((outcomes[1] == 0)) || exit "${outcomes[1]}"
          exit "${outcomes[0]}"
        env:
          # Missing GPU setup is a real failure; the ONE Nextest GPU group
          # coordinates separate test processes, unlike in-process test locks.
          TZE_HUD_REQUIRE_GPU: "1"
      - name: Upload Nextest unit evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: nextest-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test_results/compile-diet/nextest/
            target/nextest/default/junit.xml
          if-no-files-found: warn

  # ── Integration: headless multi-crate suites ───────────────────────────────
  #
  # Runs the `integration` package's test targets that are fast and headless
  # (HeadlessRuntime + software GPU via HEADLESS_FORCE_SOFTWARE=1; no display
  # server required).
  # `just test-integration` runs the same `--tests` command.

  test-integration:
    name: cargo test (integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Native Linux only: preserve MinGW/MSVC flags and the system ld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned mold (native Linux linker)
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        timeout-minutes: 5
        with:
          mold-version: "2.42.1"
          make-default: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      # timeout-minutes caps cache-save hangs (incident: PR #606, canonical-app-production-boot
      # hung 15+ min in the Swatinem/rust-cache post-step, required --admin merge).
      # v2.9.1 pins to a specific stable release rather than the floating v2 alias.
      - uses: Swatinem/rust-cache@v2.9.1
        timeout-minutes: 10
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Mesa / llvmpipe
        timeout-minutes: 5
        run: |
          # Remove only the observed Azure HTTP route; keep signed HTTPS fallbacks.
          # An unsupported hosted image layout must fail before package acquisition.
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          test -f "$apt_mirror_list"
          test ! -L "$apt_mirror_list"
          grep -Eq '^https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' "$apt_mirror_list"
          grep -Eq '^https://security[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' "$apt_mirror_list"
          sudo sed -Ei '\|^http://azure[.]archive[.]ubuntu[.]com/ubuntu/?([[:space:]].*)?$|d' "$apt_mirror_list"
          sudo apt-get $APT_OPTS update -q --error-on=any
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            mesa-utils \
            libegl-mesa0 \
            libgl1-mesa-dri
      - name: cargo test -p integration (headless suites)
        run: |
          cargo test -p integration --tests
      - name: Test token-footprint gate contract
        run: >-
          python3 -m unittest
          scripts.ci.test_check_token_footprint
          scripts.ci.test_token_footprint_flow
      - name: Calibrate deterministic LLM-facing token footprint
        env:
          HEADLESS_FORCE_SOFTWARE: "1"
        run: |
          mkdir -p test_results/token-footprint
          cargo run -p benchmark --features headless \
            --bin token_footprint_calibration -- \
            --output test_results/token-footprint/measurement.json
          cargo run -p benchmark --features headless \
            --bin token_footprint_calibration -- \
            --output test_results/token-footprint/repeat.json
          cmp test_results/token-footprint/measurement.json \
            test_results/token-footprint/repeat.json
          python3 scripts/ci/check_token_footprint.py \
            --measurement test_results/token-footprint/measurement.json \
            --baseline scripts/ci/token_footprint_baseline.json \
            --output test_results/token-footprint/gate-report.json
      - name: Upload token-footprint calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-footprint-calibration
          path: test_results/token-footprint/
          if-no-files-found: error

  # ── User-test Python suite ──────────────────────────────────────────────────
  #
  # Runs the pure-Python unit tests under .claude/skills/user-test/{tests,scripts}/.
  # Previously this suite only ran interactively via the user-test skill, so
  # drift went undetected until a worker tripped over it (hud-43z24).
  #
  # Scope is limited to files verified hermetic by reading + running locally:
  # no GPU, no Windows, no live HUD runtime, no external network.
  #   - tests/ (presence card, portal client, projection adoption docs)
  #   - scripts/test_hud_grpc_client.py (needs the packages installed below;
  #     without the `blake3` package it falls back to compiling a tiny cargo
  #     helper on the fly — a hidden crates.io network dependency — so
  #     installing the `blake3` wheel here keeps this job fully pip-hermetic)
  #
  # Excluded: scripts/stress_test_zones.py, publish_widget_batch.py,
  # publish_zone_batch.py and the other *_exemplar.py scripts under scripts/ —
  # these are live-HUD-runtime CLI tools (gRPC session against a running
  # resident), not unit-test suites, and have no test_*.py counterpart here.

  user-test-python-suite:
    name: user-test python suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: |
          pip install --quiet -r scripts/requirements-dev.txt
      - name: Run pure-Python user-test suite
        run: |
          python3 -m pytest \
            .claude/skills/user-test/tests/ \
            .claude/skills/user-test/scripts/test_hud_grpc_client.py \
            scripts/tests/ \
            -q
      - name: Run scripts/ci unit tests
        run: python3 -m unittest discover -s scripts/ci

  # ── Dev-mode guard ──────────────────────────────────────────────────────────
  #
  # Verifies that `dev-mode` is not enabled by a default build of any workspace
  # package, including the tze_hud_app release binary's whole dependency closure
  # (feature edges and indirection included; scripts/ci/check_dev_mode_defaults.py).
  # This is a Cargo metadata check only; the real release build runs in windows.yml.
  # `just dev-mode-guard` runs the same command.

  dev-mode-guard:
    name: dev-mode guard (release build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify dev-mode is not a default feature
        run: cargo metadata --format-version 1 --no-deps | python3 scripts/ci/check_dev_mode_defaults.py

  # ── Dependency security + license audit (cargo-deny) ──────────────────────
  #
  # Runs cargo-deny to check:
  #   - advisories: known CVEs and unmaintained crates (RUSTSEC database)
  #   - licenses: all dependencies must be GPL-3.0 compatible per deny.toml
  #
  # This job does NOT require compilation — cargo-deny reads Cargo.lock and
  # crate metadata only.  It runs against the same Rust toolchain as the rest
  # of CI so that workspace metadata resolution is consistent.
  #
  # Advisory waivers and license allowances are documented with rationale in
  # deny.toml at the repository root.  See hud-1aswu.5 for context.
  #
  # Uses EmbarkStudios/cargo-deny-action for a stable, versioned install.
  # The current @v2 reference is a version tag, not a commit SHA.

  cargo-deny:
    name: cargo deny (advisories + licenses)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: cargo deny check advisories + licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Explicitly check all four gates: advisories, licenses, bans and sources.
          command: check advisories licenses bans sources
          # Log level: warn surfaces yanked-crate and duplicate-version notices
          # without failing the job.
          log-level: warn
