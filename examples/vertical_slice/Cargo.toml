[package]
name = "vertical_slice"
description = "Reference vertical slice example for tze_hud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vertical_slice"
path = "src/main.rs"

[dependencies]
tze_hud_config = { path = "../../crates/tze_hud_config", version = "0.1.0" }
tze_hud_runtime = { path = "../../crates/tze_hud_runtime", version = "0.1.0" }
tze_hud_protocol = { path = "../../crates/tze_hud_protocol", version = "0.1.0" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }

[dev-dependencies]
# dev-mode: tests/budget_assertions.rs boots with config_toml: None (unrestricted
# agents). The released binary does not carry it.
tze_hud_runtime = { path = "../../crates/tze_hud_runtime", version = "0.1.0", features = ["dev-mode"] }
tze_hud_scene = { path = "../../crates/tze_hud_scene", version = "0.1.0", features = ["test-support"] }
tze_hud_compositor = { path = "../../crates/tze_hud_compositor", version = "0.1.0" }
tze_hud_input = { path = "../../crates/tze_hud_input", version = "0.1.0" }
tze_hud_telemetry = { path = "../../crates/tze_hud_telemetry", version = "0.1.0" }

[lints]
workspace = true
