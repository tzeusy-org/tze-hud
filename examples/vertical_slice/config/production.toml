# Vertical Slice — Production Configuration
#
# This is the canonical runtime config for the vertical_slice example.
# Only the agent paired in agents.toml ("vertical-slice-agent") may connect,
# with its `allow` list there; any other PSK is rejected.
#
# Usage:
#   cargo run -p vertical_slice

[runtime]
profile = "headless"

[[tabs]]
name = "Main"
default_tab = true

# Design tokens: overrides of the canonical defaults, shared by every zone,
# widget SVG, and the portal.
[design_tokens]
"color.text.primary"                   = "#F5F7FA"
"color.border.default"                 = "#6E7A91"
"opacity.backdrop.opaque"              = "0.80"
"typography.body.size"                 = "15"
"typography.body.weight"               = "500"
"spacing.padding.medium"               = "10"
"border.radius.medium"                 = "14"
"color.notification.urgency.low"       = "#000000"
"color.notification.urgency.normal"    = "#0C1426"
"color.notification.urgency.urgent"    = "#2A1E08"
"color.notification.urgency.critical"  = "#450612"
"typography.notification.body.scale"   = "0.90"
"typography.notification.title.weight" = "700"

# Widget bundle directories scanned at startup.
# Paths are resolved relative to this config file's parent directory
# (examples/vertical_slice/config/).
#
# assets/widget_bundles/ holds all production bundles (gauge, progress-bar,
# status-indicator).
[widget_bundles]
paths = [
    "../../../assets/widget_bundles",
]

# Widget instances declared on the Main tab.
#
# Instance names used by user-test fixtures (see .claude/skills/user-test/):
#   main-progress  → progress-bar widget
#   main-status    → status-indicator widget
#
# IMPORTANT: the MCP surface widget:<name> refers to instance_id (not widget_type).

# Progress bar: horizontal progress bar in a clearly visible lower-left position.
# MCP widget_name: "main-progress"
[[tabs.widgets]]
widget_type = "progress-bar"
instance_id  = "main-progress"

[tabs.widgets.geometry]
x_pct      = 0.421875
y_pct      = 0.9074074
width_pct  = 0.15625
height_pct = 0.0185185

# Status indicator: small status circle at top-right corner.
# MCP widget_name: "main-status"
[[tabs.widgets]]
widget_type = "status-indicator"
instance_id  = "main-status"

[tabs.widgets.geometry]
x      = 1860
y      = 10
width  = 48
height = 56
