[package]
name = "render_artifacts"
description = "Headless readback binaries that render runtime scenes to PNG"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cooperative-projection-readback"
path = "src/bin/cooperative_projection_readback.rs"
required-features = ["headless"]

[[bin]]
name = "vertical-flow-readback"
path = "src/bin/vertical_flow_readback.rs"
required-features = ["headless"]

[features]
# Enable headless GPU rendering for the readback binaries.
headless = ["dep:tze_hud_compositor", "dep:tze_hud_runtime"]

[dependencies]
tze_hud_scene = { path = "../../crates/tze_hud_scene", version = "0.1.0" }
tze_hud_compositor = { path = "../../crates/tze_hud_compositor", version = "0.1.0", optional = true }
tze_hud_runtime = { path = "../../crates/tze_hud_runtime", version = "0.1.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
