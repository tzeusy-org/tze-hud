[package]
name = "integration"
description = "Multi-crate integration tests for tze_hud"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "it"
path = "it/main.rs"

# Integration tests always run headless (no display server required).
#
# dev-mode is required because multi_agent.rs uses config_toml: None.
# Integration tests are separate binaries; cfg(test) is set in them but NOT
# in the library they link, so dev-mode is enabled explicitly (in
# [dev-dependencies] below).
[dependencies]
tze_hud_scene = { path = "../../crates/tze_hud_scene", version = "0.1.0" }
tze_hud_input = { path = "../../crates/tze_hud_input", version = "0.1.0" }
tze_hud_compositor = { path = "../../crates/tze_hud_compositor", version = "0.1.0" }
tze_hud_runtime = { path = "../../crates/tze_hud_runtime", version = "0.1.0" }
tze_hud_protocol = { path = "../../crates/tze_hud_protocol", version = "0.1.0" }
tze_hud_projection = { path = "../../crates/tze_hud_projection", version = "0.1.0" }
tze_hud_config = { path = "../../crates/tze_hud_config", version = "0.1.0" }
tze_hud_resource = { path = "../../crates/tze_hud_resource", version = "0.1.0" }
tze_hud_telemetry = { path = "../../crates/tze_hud_telemetry", version = "0.1.0" }
tokio = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
image = { workspace = true, features = ["png"] }
blake3 = { workspace = true }
tiktoken-rs = { workspace = true }
# poc_acceptance's hung agent: a raw HTTP/2 client that stops reading replies.
h2 = "0.4"
http = "1"
bytes = "1"
prost = { workspace = true }

# The crate has only [[test]] targets, so its test-only features are enabled
# here, not in [dependencies]: feature unification then keeps test_scenes and
# dev-mode out of a whole-workspace release build.
[dev-dependencies]
tze_hud_scene = { path = "../../crates/tze_hud_scene", version = "0.1.0", features = ["test-support"] }
tze_hud_runtime = { path = "../../crates/tze_hud_runtime", version = "0.1.0", features = ["dev-mode", "test-harness"] }
tze_hud_protocol = { path = "../../crates/tze_hud_protocol", version = "0.1.0", features = ["dev-mode"] }
# poc_acceptance's control-panel agent tests write a scratch agents.toml.
tempfile = { workspace = true }

[lints]
workspace = true
