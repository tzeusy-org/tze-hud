[package]
name = "integration"
description = "Multi-crate integration tests for tze_hud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[test]]
name = "multi_agent"
path = "multi_agent.rs"

# E13: Presence card tile builder — avatar upload, tile creation, node tree.
# Tests hud-apoe.1 acceptance criteria: avatar resource upload (BLAKE3 dedup),
# tile geometry (200x80, computed y-offset, z_order), 3-node flat tree
# (SolidColorNode + StaticImageNode + TextMarkdownNode), and batch submission.
[[test]]
name = "presence_card_tile"
path = "presence_card_tile.rs"

# hud-apoe.4: Disconnect detection, orphan handling, and reconnect-within-grace tests.
# Scene-graph-level tests using TestClock for deterministic time control.
# Covers all 6 acceptance criteria (AC1-AC6) plus no-repositioning (AC7).
[[test]]
name = "disconnect_orphan"
path = "disconnect_orphan.rs"

# E13: Presence card periodic content updates and multi-agent coexistence.
# Tests hud-apoe.3 acceptance criteria: 30-second content update loop (SetTileRoot),
# human-friendly time formatting ("now", "30s ago", "1m ago", "2m ago"), and
# 3-agent concurrent coexistence (non-overlapping geometry, namespace isolation,
# concurrent content updates).
[[test]]
name = "presence_card_coexistence"
path = "presence_card_coexistence.rs"

# hud-i6yd.4: Atomic tile creation batch with resource upload.
# Tests: 48x48 PNG icon upload (BLAKE3 ResourceId), atomic MutationBatch
# (CreateTile + SetTileRoot 6-node tree + UpdateTileOpacity + UpdateTileInputMode),
# partial failure atomicity, z_order=100 in agent-owned band, and periodic
# content update (SetTileRoot) with active/expired lease checks.
[[test]]
name = "dashboard_tile_creation"
path = "dashboard_tile_creation.rs"

# hud-i6yd.5: HitRegionNode input capture, local feedback, and focus cycling.
# Tests: PointerDown/Up events on Refresh/Dismiss buttons, hover enter/leave,
# auto_capture + release_on_up semantics, focus cycling Tab/Shift+Tab,
# focus ring bounds, FocusGainedEvent/FocusLostEvent dispatch, cross-tile Tab,
# and keyboard-only activation via NAVIGATE_NEXT + ACTIVATE.
[[test]]
name = "dashboard_tile_input"
path = "dashboard_tile_input.rs"

# hud-i6yd.8: Full lifecycle user-test and headless integration scenarios.
# Tests: complete connect→lease→upload→create→update→Refresh→Dismiss lifecycle,
# disconnect-during-lifecycle (orphan + badge + grace-period cleanup),
# namespace isolation throughout lifecycle, and three headless scenarios
# (tile creation, pointer hit-test, lease TTL expiry) — all without GPU.
[[test]]
name = "dashboard_tile_lifecycle"
path = "dashboard_tile_lifecycle.rs"

# Soak and leak test suite (validation-framework/spec.md lines 298-310).
#
# Default run (fast CI, 10 seconds):
#   cargo test --test soak
#
# 1-hour CI run:
#   TZE_HUD_SOAK_SECS=3600 cargo test --test soak -- --nocapture
#
# 6-hour nightly run:
#   TZE_HUD_SOAK_SECS=21600 cargo test --test soak -- --nocapture
[[test]]
name = "soak"
path = "soak.rs"

# hud-hzub.4: Subtitle streaming breakpoint reveal — MCP and gRPC publish path verification.
# Tests: gRPC ZonePublish with stream_text + breakpoints forwarded to compositor,
# empty breakpoints = immediate reveal, replacement cancels streaming, gRPC/MCP parity,
# list_zones subtitle zone metadata (contention_policy, accepted_media_types).
[[test]]
name = "subtitle_streaming"
path = "subtitle_streaming.rs"

[[test]]
name = "text_stream_portal_surface"
path = "text_stream_portal_surface.rs"

[[test]]
name = "text_stream_portal_adapter"
path = "text_stream_portal_adapter.rs"

[[test]]
name = "text_stream_portal_coalescing"
path = "text_stream_portal_coalescing.rs"

[[test]]
name = "text_stream_portal_governance"
path = "text_stream_portal_governance.rs"

# hud-5jbra.2: Phase-1 markdown rendering subset — parse-on-commit tests.
# Covers: each subset construct (headings, bold, italic, bold-italic, inline
# code, fenced/indented code blocks, lists, links), each excluded construct
# degrading to literal text, link non-navigability, node-budget compliance
# (65535-byte payload), and zero-per-frame parse cost (task 2.4 + 2.5).
[[test]]
name = "text_stream_portal_markdown"
path = "text_stream_portal_markdown.rs"

# hud-5jbra.4: Phase-1 composer draft editing verification (task 4.7).
# Covers: local echo independence from adapter latency, word-wise delete,
# coalesced notifications, oversized-paste truncation and non-forwarding,
# submit-content fidelity, safe-mode suspension, keystroke non-passthrough
# across both adapter families (runtime draft + cooperative projection adapter).
[[test]]
name = "text_stream_portal_composer"
path = "text_stream_portal_composer.rs"

# hud-5jbra.5: Phase-1 sustained streaming cadence verification (tasks.md §5.1–5.4).
# Covers: work-conserving coalescing with cross-portal fairness, cadence harness
# (≥200 scalars/s sustained, 4KiB/250ms bursts), frame/stage budget verification,
# dual-portal fairness under equal sustained rates, retained-window coherence under
# burst. Live soak (5.5), live cadence (5.6), and RTT evidence (5.7) are deferred
# to the TzeHouse reference host.
[[test]]
name = "text_stream_portal_cadence"
path = "text_stream_portal_cadence.rs"

# hud-5jbra.6: Phase-1 portal component profile styling verification (tasks.md §6.1–6.4).
# Covers: portal part inventory token mapping, exemplar adapter consuming resolved tokens
# (no literal visual values), collapsed/expanded transitions redaction-safe, profile-swap
# reskin test, token-propagation on republish. Live profile-swap phase (§6.5) is deferred
# to the TzeHouse reference host (discovered follow-up).
[[test]]
name = "text_stream_portal_styling"
path = "text_stream_portal_styling.rs"

# hud-bs2q.5: Long-press drag-to-reposition interaction.
# Tests: long-press recognizer activation/cancellation, multi-touch independence,
# snap quantisation, boundary clamping at all 4 edges, full drag lifecycle
# (press → hold → drag → release → persisted geometry).
[[test]]
name = "drag_reposition"
path = "drag_reposition.rs"

# hud-bs2q.7: E2E integration tests for persistent movable elements.
# Tests: cross-session persistence (TOML round-trip), element discovery by
# namespace filter, display resolution change (relative-percentage invariance).
# Tests 3, 4, 6 are #[ignore]d pending hud-zc7f (reset UI) and
# ElementRepositionedEvent wiring.
[[test]]
name = "movable_elements_e2e"
path = "movable_elements_e2e.rs"

# hud-jm8nq.7: POC acceptance (docs/scope.md) for the Portal and Zones bullets,
# end to end over MCP on loopback HTTP and the real windowed event-loop
# dispatch, headless, with production.toml and an injected TestClock. The
# MCP-level regression guard for the T7 portal rewrite.
[[test]]
name = "poc_acceptance"
path = "poc_acceptance.rs"

# Integration tests always run headless (no display server required).
# tze_hud_runtime is built with the headless feature unconditionally so
# all tests run in CI without a display. The workspace-level `headless`
# feature is re-exported here for downstream tooling that may set it.
#
# dev-mode is required because multi_agent.rs uses config_toml: None.
# Integration tests are separate binaries; cfg(test) is set in them but NOT
# in the library they link, so dev-mode must be enabled explicitly here.
[features]
headless = ["tze_hud_compositor/headless"]

[dependencies]
tze_hud_scene = { path = "../../crates/tze_hud_scene", version = "0.1.0" }
tze_hud_input = { path = "../../crates/tze_hud_input", version = "0.1.0" }
tze_hud_compositor = { path = "../../crates/tze_hud_compositor", version = "0.1.0" }
tze_hud_runtime = { path = "../../crates/tze_hud_runtime", version = "0.1.0", features = ["headless", "dev-mode", "test-harness"] }
tze_hud_protocol = { path = "../../crates/tze_hud_protocol", version = "0.1.0", features = ["dev-mode"] }
tze_hud_projection = { path = "../../crates/tze_hud_projection", version = "0.1.0", features = ["resident-grpc"] }
tze_hud_config = { path = "../../crates/tze_hud_config", version = "0.1.0" }
tze_hud_resource = { path = "../../crates/tze_hud_resource", version = "0.1.0" }
tze_hud_telemetry = { path = "../../crates/tze_hud_telemetry", version = "0.1.0" }
tokio = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
image = { workspace = true, features = ["png"] }
blake3 = { workspace = true }
tiktoken-rs = { workspace = true }

[lints]
workspace = true
