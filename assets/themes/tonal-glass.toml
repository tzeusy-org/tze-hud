# Alert banner roles: an inset surface card; the severity mark (a ringed
# glyph tinted color.severity.*) carries info and caution, the error
# container critical.
"color.alert.container"          = "#222833"   # surface.container.high
"color.alert.caution.container"  = "#222833"   # surface.container.high: the mark carries caution
"color.alert.error.container"    = "#5C1A17"   # error.container
"color.alert.outline"            = "#343B47"   # outline.variant
"color.on_alert"                 = "#E8EBF0"   # on_surface
