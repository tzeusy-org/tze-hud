"color.on_alert.error"           = "#FFDAD6"   # on_error.container
"color.severity.info"            = "#8AB4FF"   # primary
"color.severity.warning"         = "#F2C14E"   # caution
"color.severity.critical"        = "#FF8A80"   # error
"opacity.alert"                  = "0.92"      # opacity.surface
"shape.alert"                    = "12"        # shape.m
"space.alert.margin"             = "16"        # space.l
