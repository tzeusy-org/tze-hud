# ── Legacy keys the current renderer reads ──────────────────────────────────
# Mapped onto the semantic palette so today's elements pick up Tonal Glass
# colours before they are restyled (hud-h51u7.4). Delete each mapping when
# its consumer moves to the semantic tokens.
"color.text.primary"                  = "#E8EBF0"   # on_surface
"color.text.secondary"                = "#A9B1BE"   # on_surface.variant
"color.text.accent"                   = "#8AB4FF"   # primary
"color.border.default"                = "#343B47"   # outline.variant
"color.backdrop.default"              = "#222833"   # surface.container.high
"color.severity.info"                 = "#8AB4FF"   # primary
"color.severity.warning"              = "#F2C14E"   # caution
"color.severity.error"                = "#FF8A80"   # error
"opacity.backdrop.opaque"             = "0.92"      # opacity.surface
"border.radius.medium"                = "16"        # shape.l
"color.notification.urgency.low"      = "#1B2028"   # surface.container
"color.notification.urgency.normal"   = "#222833"   # surface.container.high
"color.notification.urgency.urgent"   = "#4A3A10"   # caution.container
"color.notification.urgency.critical" = "#5C1A17"   # error.container
"portal.divider.color"                = "#343B47"   # outline.variant
"system_card.background"              = "#222833EB" # surface.container.high @ 0.92
"system_card.accent.color"            = "#8AB4FF"   # primary

# Carried over unchanged from the pre-theme production config (restyled in
# hud-h51u7.4).
"typography.body.size"                 = "15"
"typography.body.weight"               = "500"
"spacing.padding.medium"               = "10"
"typography.notification.body.scale"   = "0.90"
"typography.notification.title.weight" = "700"
