# Classic — black/navy surfaces, white text and the legacy blue accent.
# Select with `[design_tokens] theme = "classic"`.
# The legacy notification look is retained below; semantic roles are explicit,
# including intentionally shared grid/easing values rather than fallback.

"color.text.primary"                   = "#F5F7FA"
"color.border.default"                 = "#6E7A91"
"opacity.backdrop.opaque"              = "0.80"
"typography.body.size"                 = "15"
"typography.body.weight"               = "500"
"spacing.padding.medium"               = "10"
"border.radius.medium"                 = "14"
"color.notification.urgency.low"       = "#000000"
"color.notification.urgency.normal"    = "#0C1426"
"color.notification.urgency.urgent"    = "#2A1E08"
"color.notification.urgency.critical"  = "#450612"
"typography.notification.body.scale"   = "0.90"
"typography.notification.title.weight" = "700"

# Semantic surfaces and text; tonal levels carry structure. Blue denotes
# interaction, green success, amber caution and red error. Existing labels
# and icons remain the accompanying channels.
"color.surface" = "#000000"
"color.surface.container.low" = "#05080D"
"color.surface.container" = "#0C1426"
"color.surface.container.high" = "#141D30"
"color.surface.container.highest" = "#1E293F"
"opacity.surface" = "0.96"
"opacity.scrim" = "0.75"
"color.on_surface" = "#F5F7FA"
"color.on_surface.variant" = "#BFC7D5"
"color.outline" = "#6E7A91"
"color.outline.variant" = "#3E4A62"
"color.primary" = "#4A9EFF"
"color.on_primary" = "#071321"
"color.primary.container" = "#17375C"
"color.on_primary.container" = "#E1EDFF"
"color.success" = "#66D9A3"
"color.caution" = "#FFCA66"
"color.caution.container" = "#2A1E08"
"color.on_caution.container" = "#FFF0CA"
"color.error" = "#FF8392"
