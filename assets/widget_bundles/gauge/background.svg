<?xml version="1.0" encoding="UTF-8"?>
<!-- Static layer: the tonal card and the empty vertical track. No bindings.
     The card's edge is drawn by fill.svg's severity-bound "indicator". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 224" width="72" height="224">
  <rect
    id="card"
    data-role="backdrop"
    x="0.75" y="0.75"
    width="70.5" height="222.5"
    rx="{{token.shape.m}}" ry="{{token.shape.m}}"
    fill="{{token.color.surface.container.high}}"
    fill-opacity="{{token.opacity.surface}}"/>
  <rect
    id="track"
    x="28" y="16"
    width="16" height="168"
    rx="{{token.shape.s}}" ry="{{token.shape.s}}"
    fill="{{token.color.outline.variant}}"/>
</svg>
