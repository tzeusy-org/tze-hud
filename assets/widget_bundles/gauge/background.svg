<?xml version="1.0" encoding="UTF-8"?>
<!-- Card layer: the tonal card and the empty ring track. One binding:
       "card"  stroke <- severity (outline.variant / caution / error)
     The hairline is the card's own stroke, so fill and edge share one
     rasterizer. Ring: 80x80 box centred at (64,56), r=34, 6 wide. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 132" width="128" height="132">
  <rect
    id="card"
    data-role="backdrop"
    x="0.5" y="0.5"
    width="127" height="131"
    rx="{{token.shape.l}}" ry="{{token.shape.l}}"
    fill="{{token.color.surface.container}}"
    fill-opacity="{{token.opacity.surface}}"
    stroke="{{token.color.outline.variant}}"
    stroke-width="{{token.stroke.border.width}}"/>
  <circle
    id="track"
    cx="64" cy="56" r="34"
    fill="none"
    stroke="{{token.color.outline.variant}}"
    stroke-width="6"/>
</svg>
