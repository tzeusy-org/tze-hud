# Production gauge widget bundle.
#
# Visual contract (shared with progress-bar and status-indicator):
# - A tonal card like the notification cards: surface.container.high at
#   opacity.surface, shape.m corners; a vertical primary-colored bar on an
#   outline.variant track, label in type.title.m below
# - Severity colors the card edge: outline.variant (info), caution, error
# - Hover (runtime-driven `tooltip_visible`) lays a state layer over the card
#   and shows the `readout` chip
# - Every color, size and font comes from {{token.key}} placeholders (in the
#   SVGs and in this manifest), resolved at bundle load time. viewBox units
#   are logical px; geometry sets the scale
#
# Registered as "gauge" in the WidgetRegistry when loaded from assets/widget_bundles/.
#
# IMPORTANT: Do NOT confuse with crates/tze_hud_widget/tests/fixtures/gauge/
# which is the unit-test fixture (hardcoded colors, 100x220 viewBox).
#
# Parameters:
#   level      - Fill level (f32, 0.0-1.0); drives bar height via linear mapping
#   label      - Label below the bar (string)
#   fill_color - Bar color; defaults to the theme's primary
#   severity   - info / warning / error; colors the card edge (enum)
#   tooltip_visible - Runtime hover visibility toggle for the tooltip (f32 0..1)
#   readout    - Tooltip readout text (e.g. "42/100 (42%)")

name        = "gauge"
version     = "1.1.0"
description = "Vertical fill gauge card with severity edge, label and hover readout"

[[parameter_schema]]
name    = "level"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[[parameter_schema]]
name    = "label"
type    = "string"
default = ""

[[parameter_schema]]
name    = "fill_color"
type    = "color"
default = "{{token.color.primary}}"

[[parameter_schema]]
name    = "severity"
type    = "enum"
default = "info"

[parameter_schema.constraints]
enum_allowed_values = ["info", "warning", "error"]

[[parameter_schema]]
name    = "tooltip_visible"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[[parameter_schema]]
name    = "readout"
type    = "string"
default = "0/100 (0%)"

[parameter_schema.constraints]
string_max_bytes = 48

[hover_behavior]
delay_ms = 180
visibility_param = "tooltip_visible"
hidden_value = 0.0
visible_value = 1.0

[hover_behavior.trigger_rect]
x_pct = 0.0
y_pct = 0.0
width_pct = 1.0
height_pct = 1.0

# Background layer: static card and empty track. Zero bindings.
# Must appear first (painter's model) so fill layer renders on top.
[[layers]]
svg_file = "background.svg"

# Fill layer: severity edge, bar, label and hover readout.
[[layers]]
svg_file = "fill.svg"

[[layers.bindings]]
param            = "level"
target_element   = "bar"
target_attribute = "height"
mapping          = "linear"
attr_min         = 0.0
attr_max         = 168.0

[[layers.bindings]]
param            = "level"
target_element   = "bar"
target_attribute = "y"
mapping          = "linear"
attr_min         = 184.0
attr_max         = 16.0

[[layers.bindings]]
param            = "fill_color"
target_element   = "bar"
target_attribute = "fill"
mapping          = "direct"

[[layers.bindings]]
param            = "label"
target_element   = "label-text"
target_attribute = "text-content"
mapping          = "direct"

[[layers.bindings]]
param            = "severity"
target_element   = "indicator"
target_attribute = "stroke"
mapping          = "discrete"

[layers.bindings.value_map]
info    = "{{token.color.outline.variant}}"
warning = "{{token.color.caution}}"
error   = "{{token.color.error}}"

[[layers.bindings]]
param            = "tooltip_visible"
target_element   = "tooltip-group"
target_attribute = "opacity"
mapping          = "linear"
attr_min         = 0.0
attr_max         = 1.0

[[layers.bindings]]
param            = "readout"
target_element   = "tooltip-readout"
target_attribute = "text-content"
mapping          = "direct"
