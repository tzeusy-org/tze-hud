# Production gauge widget bundle.
#
# Visual contract (Tonal Glass ring, shared roles with progress-bar and
# status-indicator):
# - A tonal card like the notification cards: surface.container at
#   opacity.surface, shape.l corners and a stroke.border.width hairline
# - An 80x80 ring: a primary arc on an outline.variant track, clockwise
#   from 12 o'clock, with the level as a whole percent centred in
#   type.readout at type.gauge.readout.size; the label below in type.label.m
# - Severity colors the arc and the hairline: info uses fill_color
#   (default color.primary), warning color.caution, error color.error
# - Hover (runtime-driven `tooltip_visible`) lays a state layer over the
#   card and shows the `readout` text in place of the label
# - Every color, size and font comes from {{token.key}} placeholders (in the
#   SVGs and in this manifest), resolved at bundle load time. viewBox units
#   are logical px; geometry sets the scale
#
# Registered as "gauge" in the WidgetRegistry when loaded from assets/widget_bundles/.
#
# IMPORTANT: Do NOT confuse with crates/tze_hud_widget/tests/fixtures/gauge/
# which is the unit-test fixture (hardcoded colors, 100x220 viewBox).
#
# Parameters:
#   level      - Fill level (f32, 0.0-1.0); drives the arc and the percent
#   label      - Label below the ring (string)
#   fill_color - Owner info fill; warning/error use severity tokens
#   severity   - info / warning / error; colors the arc and hairline (enum)
#   tooltip_visible - Runtime hover visibility toggle for the readout (f32 0..1)
#   readout    - Hover readout text (e.g. "42/100 (42%)")

name        = "gauge"
version     = "3.0.0"
description = "Ring gauge card with centred percent, severity color, label and hover readout"

[[parameter_schema]]
name    = "level"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[[parameter_schema]]
name    = "label"
type    = "string"
default = ""

[[parameter_schema]]
name    = "fill_color"
audience = "owner"
type    = "color"
default = "{{token.color.primary}}"

[[parameter_schema]]
name    = "severity"
type    = "enum"
default = "info"

[parameter_schema.constraints]
enum_allowed_values = ["info", "warning", "error"]

[[parameter_schema]]
name    = "tooltip_visible"
audience = "runtime"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[[parameter_schema]]
name    = "readout"
type    = "string"
default = "0/100 (0%)"

[parameter_schema.constraints]
string_max_bytes = 48

[hover_behavior]
delay_ms = 180
visibility_param = "tooltip_visible"
hidden_value = 0.0
visible_value = 1.0

[hover_behavior.trigger_rect]
x_pct = 0.0
y_pct = 0.0
width_pct = 1.0
height_pct = 1.0

# Background layer: card (severity-colored hairline) and empty ring track.
# Must appear first (painter's model) so fill layer renders on top.
[[layers]]
svg_file = "background.svg"

[[layers.bindings]]
param            = "severity"
target_element   = "card"
target_attribute = "stroke"
mapping          = "discrete"

[layers.bindings.value_map]
info    = "{{token.color.outline.variant}}"
warning = "{{token.color.caution}}"
error   = "{{token.color.error}}"

# Fill layer: arc, percent, label and hover readout.
# The arc's dash runs from offset 213.63 (the ring's circumference: empty)
# to 0 (full).
[[layers]]
svg_file = "fill.svg"

[[layers.bindings]]
param            = "level"
target_element   = "arc"
target_attribute = "stroke-dashoffset"
mapping          = "linear"
attr_min         = 213.63
attr_max         = 0.0

[[layers.bindings]]
param            = "fill_color"
target_element   = "arc"
target_attribute = "stroke"
mapping          = "direct"

[[layers.bindings]]
param            = "level"
target_element   = "severity-arc"
target_attribute = "stroke-dashoffset"
mapping          = "linear"
attr_min         = 213.63
attr_max         = 0.0

[[layers.bindings]]
param            = "severity"
target_element   = "severity-arc"
target_attribute = "stroke"
mapping          = "discrete"

[layers.bindings.value_map]
info    = "{{token.color.primary}}"
warning = "{{token.color.caution}}"
error   = "{{token.color.error}}"

[[layers.bindings]]
param            = "severity"
target_element   = "severity-arc-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
info    = "0"
warning = "1"
error   = "1"

[[layers.bindings]]
param            = "severity"
target_element   = "info-arc-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
info    = "1"
warning = "0"
error   = "0"

[[layers.bindings]]
param            = "level"
target_element   = "percent-value"
target_attribute = "text-content"
mapping          = "linear"
attr_min         = 0.0
attr_max         = 100.0

[[layers.bindings]]
param            = "label"
target_element   = "label-text"
target_attribute = "text-content"
mapping          = "direct"

[[layers.bindings]]
param            = "tooltip_visible"
target_element   = "label-group"
target_attribute = "opacity"
mapping          = "linear"
attr_min         = 1.0
attr_max         = 0.0

[[layers.bindings]]
param            = "tooltip_visible"
target_element   = "tooltip-group"
target_attribute = "opacity"
mapping          = "linear"
attr_min         = 0.0
attr_max         = 1.0

[[layers.bindings]]
param            = "readout"
target_element   = "tooltip-readout"
target_attribute = "text-content"
mapping          = "direct"
