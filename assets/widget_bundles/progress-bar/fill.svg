<?xml version="1.0" encoding="UTF-8"?>
<!-- Bound fill and always-visible percent; runtime hover adds the state layer. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 {{token.progress.width}} {{token.progress.height}}"
  width="{{token.progress.width}}"
  height="{{token.progress.height}}">
  <g id="info-fill" opacity="{{token.state.visible.opacity}}">
    <rect
      id="fill-bar"
      x="{{token.progress.content.x}}"
      y="{{token.progress.track.y}}"
      width="0"
      height="{{token.progress.track.height}}"
      rx="{{token.progress.track.radius}}"
      fill="{{token.color.primary}}"/>
  </g>
  <g id="severity-fill-group" opacity="{{token.state.hidden.opacity}}">
    <rect
      id="severity-fill"
      x="{{token.progress.content.x}}"
      y="{{token.progress.track.y}}"
      width="0"
      height="{{token.progress.track.height}}"
      rx="{{token.progress.track.radius}}"
      fill="{{token.color.primary}}"/>
  </g>
  <text
    id="label-text"
    data-role="text"
    x="{{token.progress.content.x}}"
    y="{{token.progress.text.y}}"
    font-family="{{token.type.label.m.family}}, sans-serif"
    font-size="{{token.type.label.m.size}}"
    font-weight="{{token.type.label.m.weight}}"
    fill="{{token.color.on_surface.variant}}"></text>
  <text
    id="readout"
    data-role="text"
    x="{{token.progress.readout.x}}"
    y="{{token.progress.text.y}}"
    text-anchor="end"
    font-family="{{token.type.readout.family}}, monospace"
    font-size="{{token.type.label.m.size}}"
    font-weight="{{token.type.label.m.weight}}"
    fill="{{token.color.on_surface}}"><tspan id="readout-value">0</tspan>%</text>
  <g id="tooltip-group" opacity="{{token.state.hidden.opacity}}">
    <rect
      id="hover-layer"
      x="{{token.progress.edge.inset}}"
      y="{{token.progress.edge.inset}}"
      width="{{token.progress.edge.width}}"
      height="{{token.progress.edge.height}}"
      rx="{{token.shape.m}}"
      fill="{{token.color.on_surface}}"
      fill-opacity="{{token.state.hover.opacity}}"/>
  </g>
</svg>
