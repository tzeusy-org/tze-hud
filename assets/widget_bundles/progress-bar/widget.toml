# Production progress card: token-driven 320x50 layout, label/readout row
# above a 4dp track. Hover adds a local state layer; percent is always visible.
# Owner fill_color and model severity keep their existing contract.

name        = "progress-bar"
version     = "3.0.0"
description = "Horizontal progress bar with label and percent readout"

[[parameter_schema]]
name    = "progress"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[[parameter_schema]]
name    = "label"
type    = "string"
default = ""

[parameter_schema.constraints]
string_max_bytes = 32

[[parameter_schema]]
name    = "fill_color"
audience = "owner"
type    = "color"
default = "{{token.color.primary}}"

[[parameter_schema]]
name    = "tooltip_visible"
audience = "runtime"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[[parameter_schema]]
name = "severity"
type = "enum"
default = "info"

[parameter_schema.constraints]
enum_allowed_values = ["info", "warning", "error"]

[hover_behavior]
delay_ms = "{{token.progress.hover.delay_ms}}"
visibility_param = "tooltip_visible"
hidden_value = 0.0
visible_value = 1.0

[hover_behavior.trigger_rect]
x_pct = 0.0
y_pct = 0.0
width_pct = 1.0
height_pct = 1.0

# Track layer: static card and empty track. Zero bindings.
# Must appear first (painter's model) so the fill layer renders on top.
[[layers]]
svg_file = "track.svg"

# Fill layer: bar, label and hover readout.
[[layers]]
svg_file = "fill.svg"

[[layers.bindings]]
param            = "progress"
target_element   = "fill-bar"
target_attribute = "width"
mapping          = "linear"
attr_min         = 0.0
attr_max         = "{{token.progress.track.width}}"

[[layers.bindings]]
param            = "fill_color"
target_element   = "fill-bar"
target_attribute = "fill"
mapping          = "direct"

[[layers.bindings]]
param            = "label"
target_element   = "label-text"
target_attribute = "text-content"
mapping          = "direct"

[[layers.bindings]]
param            = "tooltip_visible"
target_element   = "tooltip-group"
target_attribute = "opacity"
mapping          = "linear"
attr_min         = "{{token.state.hidden.opacity}}"
attr_max         = "{{token.state.visible.opacity}}"

# A linear binding onto text-content renders a whole number.
[[layers.bindings]]
param            = "progress"
target_element   = "readout-value"
target_attribute = "text-content"
mapping          = "linear"
attr_min         = 0.0
attr_max         = 100.0

[[layers.bindings]]
param = "progress"
target_element = "severity-fill"
target_attribute = "width"
mapping = "linear"
attr_min = 0.0
attr_max = "{{token.progress.track.width}}"

[[layers.bindings]]
param = "severity"
target_element = "severity-fill"
target_attribute = "fill"
mapping = "discrete"

[layers.bindings.value_map]
info = "{{token.color.primary}}"
warning = "{{token.color.caution}}"
error = "{{token.color.error}}"

[[layers.bindings]]
param = "severity"
target_element = "severity-fill-group"
target_attribute = "opacity"
mapping = "discrete"

[layers.bindings.value_map]
info = "{{token.state.hidden.opacity}}"
warning = "{{token.state.visible.opacity}}"
error = "{{token.state.visible.opacity}}"

[[layers.bindings]]
param = "severity"
target_element = "info-fill"
target_attribute = "opacity"
mapping = "discrete"

[layers.bindings.value_map]
info = "{{token.state.visible.opacity}}"
warning = "{{token.state.hidden.opacity}}"
error = "{{token.state.hidden.opacity}}"
