<?xml version="1.0" encoding="UTF-8"?>
<!-- Static card and full empty track; viewBox units are logical dp. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 {{token.progress.width}} {{token.progress.height}}"
  width="{{token.progress.width}}"
  height="{{token.progress.height}}">
  <rect
    id="card"
    data-role="backdrop"
    x="{{token.progress.edge.inset}}"
    y="{{token.progress.edge.inset}}"
    width="{{token.progress.edge.width}}"
    height="{{token.progress.edge.height}}"
    rx="{{token.shape.m}}"
    fill="{{token.color.surface.container.low}}"
    fill-opacity="{{token.opacity.surface}}"
    stroke="{{token.color.outline.variant}}"
    stroke-width="{{token.stroke.border.width}}"/>
  <rect
    id="track"
    x="{{token.progress.content.x}}"
    y="{{token.progress.track.y}}"
    width="{{token.progress.track.width}}"
    height="{{token.progress.track.height}}"
    rx="{{token.progress.track.radius}}"
    fill="{{token.color.outline.variant}}"/>
</svg>
