# Production status pill: status name and bounded inline reason, with the full
# owner label/reason tooltip below. Owner theme selects minimal/system/friendly
# marker groups; agents keep their existing status/label/reason schema.

name        = "status-indicator"
version     = "3.0.0"
description = "Status pill with selectable marker style and hover tooltip"
default_contention_policy = "LatestWins"

[[parameter_schema]]
name    = "status"
type    = "enum"
default = "offline"

[parameter_schema.constraints]
enum_allowed_values = ["online", "away", "busy", "offline"]

[[parameter_schema]]
name    = "theme"
audience = "owner"
type    = "enum"
default = "system"

[parameter_schema.constraints]
enum_allowed_values = ["minimal", "system", "friendly"]

[[parameter_schema]]
name    = "label"
type    = "string"
default = ""

[parameter_schema.constraints]
string_max_bytes = 16

[[parameter_schema]]
name    = "reason"
type    = "string"
default = ""

[parameter_schema.constraints]
string_max_bytes = 160

[[parameter_schema]]
name    = "tooltip_visible"
audience = "runtime"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[hover_behavior]
delay_ms = "{{token.status.hover.delay_ms}}"
visibility_param = "tooltip_visible"
hidden_value = 0.0
visible_value = 1.0

# The full pill is 40dp tall in its 320x124 tooltip canvas.
[hover_behavior.trigger_rect]
x_pct = 0.0
y_pct = 0.0
width_pct = 1.0
height_pct = "{{token.status.hover.height_pct}}"

[[layers]]
svg_file = "indicator.svg"

[[layers.bindings]]
param            = "status"
target_element   = "minimal-fill"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.caution}}"
offline = "{{token.color.on_surface.variant}}"

[[layers.bindings]]
param            = "status"
target_element   = "system-fill"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.caution}}"
offline = "{{token.color.on_surface.variant}}"

[[layers.bindings]]
param            = "status"
target_element   = "system-glyph"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.caution}}"
offline = "{{token.color.on_surface.variant}}"

[[layers.bindings]]
param            = "status"
target_element   = "system-glyph"
target_attribute = "text-content"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "✓"
away    = "…"
busy    = "!"
offline = "×"

[[layers.bindings]]
param            = "status"
target_element   = "friendly-fill"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.caution}}"
offline = "{{token.color.on_surface.variant}}"

[[layers.bindings]]
param            = "status"
target_element   = "friendly-glyph"
target_attribute = "text-content"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "☺"
away    = "☕"
busy    = "⚡"
offline = "☾"

[[layers.bindings]]
param            = "status"
target_element   = "friendly-glyph"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.caution}}"
offline = "{{token.color.on_surface.variant}}"

[[layers.bindings]]
param            = "status"
target_element   = "tooltip-dot"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.caution}}"
offline = "{{token.color.on_surface.variant}}"

[[layers.bindings]]
param            = "theme"
target_element   = "minimal-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
minimal  = "{{token.state.visible.opacity}}"
system   = "{{token.state.hidden.opacity}}"
friendly = "{{token.state.hidden.opacity}}"

[[layers.bindings]]
param            = "theme"
target_element   = "system-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
minimal  = "{{token.state.hidden.opacity}}"
system   = "{{token.state.visible.opacity}}"
friendly = "{{token.state.hidden.opacity}}"

[[layers.bindings]]
param            = "theme"
target_element   = "friendly-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
minimal  = "{{token.state.hidden.opacity}}"
system   = "{{token.state.hidden.opacity}}"
friendly = "{{token.state.visible.opacity}}"

[[layers.bindings]]
param            = "tooltip_visible"
target_element   = "tooltip-group"
target_attribute = "opacity"
mapping          = "linear"
attr_min         = "{{token.state.hidden.opacity}}"
attr_max         = "{{token.state.visible.opacity}}"

[[layers.bindings]]
param            = "label"
target_element   = "tooltip-label"
target_attribute = "text-content"
mapping          = "direct"

[[layers.bindings]]
param            = "reason"
target_element   = "tooltip-reason"
target_attribute = "text-content"
mapping          = "direct"

[[layers.bindings]]
param = "status"
target_element = "status-name"
target_attribute = "text-content"
mapping = "discrete"

[layers.bindings.value_map]
online = "Online"
away = "Away"
busy = "Busy"
offline = "Offline"

[[layers.bindings]]
param = "reason"
target_element = "inline-reason"
target_attribute = "text-content"
mapping = "direct"
