# Production status-indicator widget bundle.
#
# Visual contract (shared with gauge and progress-bar):
# - Compact top-right badge: a tonal tile like the notification cards
#   (surface.container.high at opacity.surface, outline.variant edge, shape.m
#   corners); no always-visible label text
# - `status` colors the badge content: online = success, away = caution,
#   busy = error, offline = outline; `theme` picks dot, glyph, or expressive
#   glyph
# - Hover over the badge (runtime-driven `tooltip_visible`) shows a tooltip
#   panel with a status dot, `label` and `reason`
# - Every color, size and font comes from {{token.key}} placeholders (in the
#   SVG and in this manifest), resolved at bundle load time. viewBox units are
#   logical px; geometry sets the scale
#
# Registered as "status-indicator" in the WidgetRegistry when loaded from:
# assets/widget_bundles/status-indicator/.

name        = "status-indicator"
version     = "1.1.0"
description = "Compact status badge with selectable glyph style and hover tooltip"
default_contention_policy = "LatestWins"

[[parameter_schema]]
name    = "status"
type    = "enum"
default = "offline"

[parameter_schema.constraints]
enum_allowed_values = ["online", "away", "busy", "offline"]

[[parameter_schema]]
name    = "theme"
type    = "enum"
default = "system"

[parameter_schema.constraints]
enum_allowed_values = ["minimal", "system", "friendly"]

[[parameter_schema]]
name    = "label"
type    = "string"
default = ""

[parameter_schema.constraints]
string_max_bytes = 16

[[parameter_schema]]
name    = "reason"
type    = "string"
default = ""

[parameter_schema.constraints]
string_max_bytes = 160

[[parameter_schema]]
name    = "tooltip_visible"
type    = "f32"
default = 0.0

[parameter_schema.constraints]
f32_min = 0.0
f32_max = 1.0

[hover_behavior]
delay_ms = 180
visibility_param = "tooltip_visible"
hidden_value = 0.0
visible_value = 1.0

# The badge: x 280..320, y 0..40 of the 320x124 viewBox.
[hover_behavior.trigger_rect]
x_pct = 0.875
y_pct = 0.0
width_pct = 0.125
height_pct = 0.3226

[[layers]]
svg_file = "indicator.svg"

[[layers.bindings]]
param            = "status"
target_element   = "minimal-fill"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.error}}"
offline = "{{token.color.outline}}"

[[layers.bindings]]
param            = "status"
target_element   = "system-fill"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.error}}"
offline = "{{token.color.outline}}"

[[layers.bindings]]
param            = "status"
target_element   = "system-glyph"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.error}}"
offline = "{{token.color.outline}}"

[[layers.bindings]]
param            = "status"
target_element   = "system-glyph"
target_attribute = "text-content"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "✓"
away    = "…"
busy    = "!"
offline = "×"

[[layers.bindings]]
param            = "status"
target_element   = "friendly-fill"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.error}}"
offline = "{{token.color.outline}}"

[[layers.bindings]]
param            = "status"
target_element   = "friendly-glyph"
target_attribute = "text-content"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "☺"
away    = "☕"
busy    = "⚡"
offline = "☾"

[[layers.bindings]]
param            = "status"
target_element   = "friendly-glyph"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.error}}"
offline = "{{token.color.outline}}"

[[layers.bindings]]
param            = "status"
target_element   = "tooltip-dot"
target_attribute = "fill"
mapping          = "discrete"

[layers.bindings.value_map]
online  = "{{token.color.success}}"
away    = "{{token.color.caution}}"
busy    = "{{token.color.error}}"
offline = "{{token.color.outline}}"

[[layers.bindings]]
param            = "theme"
target_element   = "minimal-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
minimal  = "1"
system   = "0"
friendly = "0"

[[layers.bindings]]
param            = "theme"
target_element   = "system-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
minimal  = "0"
system   = "1"
friendly = "0"

[[layers.bindings]]
param            = "theme"
target_element   = "friendly-group"
target_attribute = "opacity"
mapping          = "discrete"

[layers.bindings.value_map]
minimal  = "0"
system   = "0"
friendly = "1"

[[layers.bindings]]
param            = "tooltip_visible"
target_element   = "tooltip-group"
target_attribute = "opacity"
mapping          = "linear"
attr_min         = 0.0
attr_max         = 1.0

[[layers.bindings]]
param            = "label"
target_element   = "tooltip-label"
target_attribute = "text-content"
mapping          = "direct"

[[layers.bindings]]
param            = "reason"
target_element   = "tooltip-reason"
target_attribute = "text-content"
mapping          = "direct"
