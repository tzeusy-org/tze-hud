<?xml version="1.0" encoding="UTF-8"?>
<!-- Status badge (top right) with a hover tooltip below it.

     The badge is a tonal tile like the notification cards; `theme` picks what
     sits on it, and `status` colors it (success / caution / error / outline):
       minimal-group   a solid status dot
       system-group    a tonal status disc with a glyph (✓ … ! ×)
       friendly-group  a tonal status disc with an expressive glyph

     Bindings (widget.toml):
       minimal-fill, system-fill, system-glyph, friendly-fill, friendly-glyph,
       tooltip-dot  <- status (discrete fill / text-content)
       *-group      <- theme (discrete opacity)
       tooltip-group <- tooltip_visible (linear opacity 0..1)
       tooltip-label <- label, tooltip-reason <- reason (direct text-content)

     viewBox units are logical px; geometry sets the scale. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 124" width="320" height="124">
  <rect
    id="badge"
    data-role="backdrop"
    x="280.5" y="0.5"
    width="39" height="39"
    rx="{{token.shape.m}}" ry="{{token.shape.m}}"
    fill="{{token.color.surface.container.high}}"
    fill-opacity="{{token.opacity.surface}}"
    stroke="{{token.color.outline.variant}}"
    stroke-width="{{token.stroke.border.width}}"/>

  <g id="minimal-group" opacity="0">
    <circle id="minimal-fill" cx="300" cy="20" r="7" fill="{{token.color.outline}}"/>
  </g>

  <g id="system-group" opacity="1">
    <circle id="system-fill" cx="300" cy="20" r="13"
            fill="{{token.color.outline}}" fill-opacity="0.22"/>
    <text id="system-glyph" x="300" y="25.5"
          text-anchor="middle"
          font-family="{{token.type.title.m.family}}, sans-serif"
          font-size="{{token.type.title.m.size}}"
          font-weight="{{token.type.title.m.weight}}"
          fill="{{token.color.outline}}">×</text>
  </g>

  <g id="friendly-group" opacity="0">
    <circle id="friendly-fill" cx="300" cy="20" r="13"
            fill="{{token.color.outline}}" fill-opacity="0.22"/>
    <text id="friendly-glyph" x="300" y="25.5"
          text-anchor="middle"
          font-family="{{token.type.title.m.family}}, sans-serif"
          font-size="{{token.type.title.m.size}}"
          fill="{{token.color.outline}}">☾</text>
  </g>

  <!-- Tooltip; hidden until the runtime drives tooltip_visible to 1. -->
  <g id="tooltip-group" opacity="0">
    <rect
      id="tooltip-panel"
      x="0.5" y="48.5"
      width="319" height="75"
      rx="{{token.shape.m}}" ry="{{token.shape.m}}"
      fill="{{token.color.surface.container.highest}}"
      stroke="{{token.color.outline.variant}}"
      stroke-width="{{token.stroke.border.width}}"/>
    <circle id="tooltip-dot" cx="20" cy="71" r="4" fill="{{token.color.outline}}"/>
    <text
      id="tooltip-label"
      data-role="text"
      x="32" y="77"
      font-family="{{token.type.title.m.family}}, sans-serif"
      font-size="{{token.type.title.m.size}}"
      font-weight="{{token.type.title.m.weight}}"
      fill="{{token.color.on_surface}}"></text>
    <text
      id="tooltip-reason"
      data-role="text"
      x="16" y="104"
      font-family="{{token.type.body.m.family}}, sans-serif"
      font-size="{{token.type.body.m.size}}"
      fill="{{token.color.on_surface.variant}}"></text>
  </g>
</svg>
