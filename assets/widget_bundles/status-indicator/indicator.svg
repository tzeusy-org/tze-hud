<?xml version="1.0" encoding="UTF-8"?>
<!-- A 40dp pill with owner-selected marker and a separate hover tooltip.
     Clip paths bound inline/tooltip text; the renderer uses resvg for clipping. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 {{token.status.width}} {{token.status.height}}"
  width="{{token.status.width}}"
  height="{{token.status.height}}">
  <defs>
    <clipPath
      id="reason-clip"><rect
      x="{{token.status.reason.x}}"
      y="{{token.status.text.clip.y}}"
      width="{{token.status.reason.width}}"
      height="{{token.status.text.clip.height}}"/></clipPath>
  </defs>
  <rect
    id="badge"
    data-role="backdrop"
    x="{{token.status.edge.inset}}"
    y="{{token.status.edge.inset}}"
    width="{{token.status.edge.width}}"
    height="{{token.status.edge.height}}"
    rx="{{token.status.pill.radius}}"
    ry="{{token.status.pill.radius}}"
    fill="{{token.color.surface.container.low}}"
    fill-opacity="{{token.opacity.surface}}"
    stroke="{{token.color.outline.variant}}"
    stroke-width="{{token.stroke.border.width}}"/>
  <g id="minimal-group" opacity="{{token.state.hidden.opacity}}">
    <circle
      id="minimal-fill"
      cx="{{token.status.marker.x}}"
      cy="{{token.status.marker.y}}"
      r="{{token.status.marker.radius}}"
      fill="{{token.color.on_surface.variant}}"/>
  </g>
  <g id="system-group" opacity="{{token.state.visible.opacity}}">
    <circle
      id="system-fill"
      cx="{{token.status.marker.x}}"
      cy="{{token.status.marker.y}}"
      r="{{token.status.marker.disc.radius}}"
      fill="{{token.color.on_surface.variant}}"
      fill-opacity="{{token.status.marker.disc.opacity}}"/>
    <text
      id="system-glyph"
      x="{{token.status.marker.x}}"
      y="{{token.status.marker.glyph.y}}"
      text-anchor="middle"
      font-family="{{token.type.label.m.family}}, sans-serif"
      font-size="{{token.status.marker.glyph.size}}"
      font-weight="{{token.type.label.m.weight}}"
      fill="{{token.color.on_surface.variant}}">×</text>
  </g>
  <g id="friendly-group" opacity="{{token.state.hidden.opacity}}">
    <circle
      id="friendly-fill"
      cx="{{token.status.marker.x}}"
      cy="{{token.status.marker.y}}"
      r="{{token.status.marker.disc.radius}}"
      fill="{{token.color.on_surface.variant}}"
      fill-opacity="{{token.status.marker.disc.opacity}}"/>
    <text
      id="friendly-glyph"
      x="{{token.status.marker.x}}"
      y="{{token.status.marker.glyph.y}}"
      text-anchor="middle"
      font-family="{{token.type.label.m.family}}, sans-serif"
      font-size="{{token.status.marker.glyph.size}}"
      fill="{{token.color.on_surface.variant}}">☾</text>
  </g>
  <text
    id="status-name"
    data-role="text"
    x="{{token.status.name.x}}"
    y="{{token.status.text.y}}"
    font-family="{{token.type.body.m.family}}, sans-serif"
    font-size="{{token.type.body.m.size}}"
    font-weight="{{token.type.label.m.weight}}"
    fill="{{token.color.on_surface}}">Offline</text>
  <rect
    x="{{token.status.separator.x}}"
    y="{{token.status.separator.y}}"
    width="{{token.stroke.border.width}}"
    height="{{token.status.separator.height}}"
    fill="{{token.color.outline.variant}}"/>
  <g clip-path="url(#reason-clip)">
    <text
      id="inline-reason"
      data-role="text"
      x="{{token.status.reason.x}}"
      y="{{token.status.text.y}}"
      font-family="{{token.type.body.m.family}}, sans-serif"
      font-size="{{token.type.body.m.size}}"
      fill="{{token.color.on_surface.variant}}"></text>
  </g>
  <g id="tooltip-group" opacity="{{token.state.hidden.opacity}}">
    <rect
      id="tooltip-panel"
      x="{{token.status.edge.inset}}"
      y="{{token.status.tooltip.y}}"
      width="{{token.status.edge.width}}"
      height="{{token.status.tooltip.height}}"
      rx="{{token.shape.m}}"
      fill="{{token.color.surface.container.highest}}"
      stroke="{{token.color.outline.variant}}"
      stroke-width="{{token.stroke.border.width}}"/>
    <circle
      id="tooltip-dot"
      cx="{{token.status.tooltip.dot.x}}"
      cy="{{token.status.tooltip.dot.y}}"
      r="{{token.status.tooltip.dot.radius}}"
      fill="{{token.color.on_surface.variant}}"/>
    <text
      id="tooltip-label"
      data-role="text"
      x="{{token.status.tooltip.label.x}}"
      y="{{token.status.tooltip.label.y}}"
      font-family="{{token.type.title.m.family}}, sans-serif"
      font-size="{{token.type.title.m.size}}"
      font-weight="{{token.type.title.m.weight}}"
      fill="{{token.color.on_surface}}"></text>
    <text
      id="tooltip-reason"
      data-role="text"
      x="{{token.status.tooltip.reason.x}}"
      y="{{token.status.tooltip.reason.y}}"
      font-family="{{token.type.body.m.family}}, sans-serif"
      font-size="{{token.type.body.m.size}}"
      fill="{{token.color.on_surface.variant}}"></text>
  </g>
</svg>
