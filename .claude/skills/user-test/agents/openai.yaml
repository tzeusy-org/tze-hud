interface:
  display_name: "User Test"
  short_description: "Pair, update the Windows HUD, publish test content, screenshot"
  default_prompt: "Run the user-test flow against the Windows HUD with no remote shell: pair with the on-screen code (hud_pair.py), update with hud_admin.py update --channel dev, publish zone and widget test messages, capture hud_admin.py screenshot, and read hud_admin.py logs on failure."
