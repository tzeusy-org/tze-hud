[package]
name = "tze_hud_compositor"
description = "wgpu compositor for tze_hud — renders scene graph to screen or offscreen"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Observe actual headless frame work without changing rendering or live telemetry.
dev-mode = ["tze_hud_telemetry/dev-mode"]

[dependencies]
tze_hud_config = { path = "../tze_hud_config", version = "0.1.0" }
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0" }
tze_hud_resource = { path = "../tze_hud_resource", version = "0.1.0" }
tze_hud_input = { path = "../tze_hud_input", version = "0.1.0" }
tze_hud_telemetry = { path = "../tze_hud_telemetry", version = "0.1.0" }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
# Lock-free atomic swap of the markdown parse-cache snapshot (hud-33qo7).
# Already a workspace dependency (used by tze_hud_runtime for the hit-test
# snapshot); reused here rather than adding a new crate, per the dependency bar.
arc-swap = { workspace = true }
glyphon = { workspace = true }
unicode-segmentation = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }
ab_glyph = { workspace = true }

# Named system-font lookup reads the Windows font registry (fonts::system).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tze_hud_mcp = { path = "../tze_hud_mcp", version = "0.1.0" }
tze_hud_telemetry = { path = "../tze_hud_telemetry", version = "0.1.0", features = ["dev-mode"] }
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0", features = ["test-support"] }
tokio = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tze_hud_widget = { path = "../tze_hud_widget", version = "0.1.0" }

[[bench]]
name = "widget_rasterize"
harness = false

[[bench]]
name = "overflow_truncate"
harness = false

[[bench]]
name = "markdown_cache"
harness = false

[lints]
workspace = true
