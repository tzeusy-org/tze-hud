[package]
name = "tze_hud_mcp"
description = "MCP (Model Context Protocol) compatibility bridge for tze_hud — JSON-RPC tools for LLM interoperability"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0" }
# Provides the shared portal state and stable `ProjectionErrorCode`
# (and surfaced in MCP `error.data.error_code`). No dependency cycle: the
# projection crate does not depend on tze_hud_mcp.
tze_hud_projection = { path = "../tze_hud_projection", version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0", features = ["test-support"] }
tokio = { workspace = true }

[lints]
workspace = true
