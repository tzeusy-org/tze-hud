syntax = "proto3";

package tze_hud.protocol.v1.session;

import "types.proto";
import "events.proto";

// ─── Session Protocol ─────────────────────────────────────────────────────────
//
// Bidirectional streaming session protocol for resident agent <-> runtime
// communication. Implements RFC 0005 (Session/Protocol).
//
// This replaces the unary-RPC model in SceneService with a single
// multiplexed bidirectional stream per agent.
//
// ID convention: All scene-object IDs use `bytes` (16-byte UUIDv7).
// Future: import from common/ids.proto once SceneId message is extracted.

// ─── gRPC service ─────────────────────────────────────────────────────────────

service HudSession {
  // Primary bidirectional session stream.
  // All session traffic (handshake, publications, uploads, events,
  // heartbeats and subscriptions) flows over this single stream.
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

// ─── Client -> Server envelope ────────────────────────────────────────────────

message ClientMessage {
  // Removed public tile/session surface; never reuse.
  reserved 20, 40;
  reserved "mutation_batch", "claim_tile";
  uint64 sequence         = 1;  // Per-direction monotonically increasing, starts at 1
  uint64 timestamp_wall_us = 2; // Sender wall-clock (UTC us since epoch); advisory only

  oneof payload {
    // Session lifecycle
    SessionInit       session_init       = 10;
    SessionResume     session_resume     = 11;
    SessionClose      session_close      = 12;

    // Keepalive
    Heartbeat         heartbeat          = 31;

    // Resident scene-resource upload (RFC 0011; session-protocol spec §Resident Upload Handshake).
    ResourceUploadStart    resource_upload_start    = 36;
    ResourceUploadChunk    resource_upload_chunk    = 37;
    ResourceUploadComplete resource_upload_complete = 38;

    // Lifecycle verbs (docs/api.md). Each request gets one RequestResult,
    // except publishes to ephemeral zones/widgets (fire-and-forget).
    Publish   publish    = 41;  // zone:<name> or widget:<name>
    Clear     clear      = 42;  // zone:<name> or widget:<name>
    Hold      hold       = 43;  // Renew a holding without resending content
  }

  // Fields 60–66 and 80–81 carried media signaling and cloud relay, removed in
  // the 2026-10 scope reset. Reserved to prevent reuse.
  reserved 60 to 66, 80, 81;

  // Removed in T5 S1: agent telemetry (no-op), IME positioning (no-op), and
  // agent scene-event emission (never delivered).
  reserved 26, 30, 33;
  reserved "telemetry_frame", "set_ime_position", "emit_scene_event";
  // Removed in T5 S2: capabilities come from the agent's allow list, not
  // mid-session requests.
  reserved 32;
  reserved "capability_request";
  // Removed in T5 S4b: lease and publish messages replaced by the lifecycle
  // verbs (Hold renews, Clear releases; Publish).
  reserved 21, 22, 23, 25, 35;
  reserved "lease_request", "lease_renew", "lease_release", "zone_publish",
    "widget_publish";
  // Removed in T5 S6: requests no client sent (mid-session subscription
  // changes, input focus/capture control, widget asset registration, element
  // discovery).
  reserved 24, 27, 28, 29, 34, 39;
  reserved "subscription_change", "input_focus_request", "input_capture_request",
    "input_capture_release", "widget_asset_register", "list_elements_request";
}

// ─── Server -> Client envelope ────────────────────────────────────────────────

message ServerMessage {
  // Removed public tile/session surface; never reuse.
  reserved 30, 54;
  reserved "scene_snapshot", "reclaimed";
  uint64 sequence         = 1;  // Per-direction monotonically increasing, starts at 1
  uint64 timestamp_wall_us = 2; // Sender wall-clock (UTC us since epoch); advisory only

  oneof payload {
    // Session lifecycle
    SessionEstablished    session_established    = 10;
    SessionError          session_error          = 11;

    // Server response to SessionResume (RFC 0005 §6.3)
    SessionResumeResult   session_resume_result  = 12;

    // Safe-mode lifecycle notifications (RFC 0005 §3.7)
    // Both are transactional (never dropped).
    SessionSuspended      session_suspended      = 13;
    SessionResumed        session_resumed        = 14;

    // Keepalive
    Heartbeat             heartbeat              = 33;

    // Event batch (defined in events.proto; RFC 0004 §8.3, §8.4, RFC 0005 §3.1)
    // Carries per-frame InputEnvelope variants (pointer, keyboard, focus, capture,
    // scroll, command events). Variants are filtered per RFC 0005 §7.1 before delivery.
    tze_hud.protocol.v1.EventBatch event_batch   = 34;

    // Scene-resource upload responses (RFC 0011 resident upload flow).
    ResourceUploadAccepted resource_upload_accepted = 41;
    ResourceStored         resource_stored          = 42;

    // Degradation notice (RFC 0005 §3.4, §7.1).
    // Transactional — never dropped. Delivered to ALL active sessions unconditionally
    // on degradation level change, regardless of subscription configuration.
    DegradationNotice     degradation_notice      = 46;

    // Scene-resource upload-specific semantic errors (RFC 0011 resident upload flow).
    ResourceErrorResponse resource_error_response = 49;

    // Element repositioned event — emitted on drag completion or reset-to-default.
    // Subscription: SCENE_TOPOLOGY (requires the corresponding event permission).
    // Message class: Transactional (never coalesced or dropped).
    tze_hud.protocol.v1.ElementRepositionedEvent element_repositioned = 51;

    // Frame-present acknowledgment for runtime frame timing. The event remains
    // available independently of the removed public mutation route.
    // Subscription: TELEMETRY_FRAMES (requires the corresponding event permission).
    // Message class: State-stream (coalesced/droppable under backpressure).
    tze_hud.protocol.v1.FramePresented frame_presented = 52;

    // The one reply shape for Publish, Clear and Hold. Transactional.
    RequestResult request_result = 53;

  }

  // Field 22 (lease_denial) was removed in the v1 vocabulary rename.
  // Reserved to prevent accidental reuse and wire-format incompatibilities.
  reserved 22;
  reserved "lease_denial";

  // Field 32 (subscription_ack) was renamed to subscription_change_result (field 39)
  // to align with the spec. Reserved to prevent accidental reuse.
  reserved 32;
  reserved "subscription_ack";

  // Fields 60–68 and 80–82 carried media signaling and cloud relay, removed in
  // the 2026-10 scope reset. Reserved to prevent reuse.
  reserved 60 to 68, 80 to 82;

  // Removed in T5 S1: lease_state_change duplicated lease_response; scene
  // deltas, backpressure signals, and runtime telemetry were never sent;
  // emit_scene_event_result went with agent scene events.
  reserved 23, 31, 35, 36, 45;
  // Removed in T5 S2 with capability negotiation.
  reserved 25;
  reserved "capability_notice";
  reserved "lease_state_change", "scene_delta", "backpressure_signal",
    "runtime_telemetry", "emit_scene_event_result";
  // Removed in T5 S4b: per-request reply messages replaced by RequestResult;
  // lease terminal pushes have also been removed.
  reserved 15, 20, 21, 40, 47;
  reserved "runtime_error", "mutation_result", "lease_response",
    "zone_publish_result", "widget_publish_result";
  // Removed in T5 S6 with the requests they answered.
  reserved 39, 43, 44, 48, 50;
  reserved "subscription_change_result", "input_focus_response",
    "input_capture_response", "widget_asset_register_result",
    "list_elements_response";
}

// ─── Authentication credentials (RFC 0005 §1.4) ──────────────────────────────

// Pre-shared key credential (v1 primary auth mechanism).
message PreSharedKeyCredential {
  string key = 1;  // The pre-shared key value
}

// Authentication credential oneof. Structured pre-shared keys are the only
// supported credential. Removed alternatives stay reserved.
message AuthCredential {
  // Removed public tile/session surface; never reuse.
  reserved 2;
  reserved "local_socket";
  reserved 3, 4;
  reserved "oauth_token", "mtls";

  oneof credential {
    PreSharedKeyCredential  pre_shared_key    = 1;
  }
}

// ─── Session lifecycle messages ───────────────────────────────────────────────

// First message from client on a new connection.
// Must arrive within handshake_timeout (default 5000ms) or stream is closed.
message SessionInit {
  // Removed public tile/session surface; never reuse.
  reserved 8, 9;
  reserved "min_protocol_version", "max_protocol_version";
  string agent_id               = 1;  // Stable agent identifier (e.g. "weather-agent")

  // Fields 2 (agent_display_name, never read) and 3 (pre_shared_key, replaced
  // by auth_credential) removed in T5 S1.
  reserved 2, 3;
  reserved "agent_display_name", "pre_shared_key";

  // Field 4 (requested_capabilities) removed in T5 S2: permissions come from
  // the agent's allow list in the runtime config.
  reserved 4;
  reserved "requested_capabilities";

  // Initial event subscriptions
  repeated string initial_subscriptions  = 5;

  // Optional resume token from a previous session
  bytes  resume_token           = 6;  // Empty = new session; non-empty = resume attempt

  // Field 7 (agent_timestamp_wall_us, clock-skew estimation) removed in the reset.
  reserved 7;
  reserved "agent_timestamp_wall_us";

  // Structured PSK credential, required for authentication.
  AuthCredential auth_credential = 13;
}

// First message from client for reconnection within grace period.
// Alternative to SessionInit when agent has a valid resume token.
message SessionResume {
  // Removed public tile/session surface; never reuse.
  reserved 4;
  reserved "pre_shared_key";
  string agent_id                   = 1;
  bytes  resume_token               = 2;  // Token from previous SessionEstablished
  uint64 last_seen_server_sequence  = 3;  // Last server sequence the client processed

  // Structured auth credential for re-authentication (RFC 0005 §6.2).
  AuthCredential auth_credential    = 5;
}

// Graceful disconnect from client.
message SessionClose {
  string reason        = 1;  // Optional human-readable reason
  reserved 2;
  reserved "expect_resume";
}

// Server response: session established (handshake accepted).
// Followed immediately by the current DegradationNotice.
message SessionEstablished {
  // Removed public tile/session surface; never reuse.
  reserved 11;
  reserved "negotiated_protocol_version";
  bytes  session_id               = 1;  // Opaque session identifier (UUIDv7)
  string namespace                = 2;  // Agent's namespace in the scene (RFC 0001 SS1.2)
  // Field 3 (granted_capabilities) removed in T5 S2.
  reserved 3;
  reserved "granted_capabilities";
  bytes  resume_token             = 4;  // Token for future reconnect within grace period
  uint64 heartbeat_interval_ms    = 5;  // How often client must send Heartbeat (default 5000)
  uint64 server_sequence          = 6;  // Starting server-side sequence number

  // Compositor wall-clock at handshake (UTC us since epoch). Agents can use it
  // as the reference for present_at_wall_us / expires_at_wall_us.
  uint64 compositor_timestamp_wall_us = 7;
  // Field 8 (estimated_skew_us) removed in the reset.
  reserved 8;
  reserved "estimated_skew_us";

  // Subscription confirmation
  repeated string active_subscriptions = 9;
  repeated string denied_subscriptions = 10;

  // Field 12 (portal_part_tokens) removed in T5 S5: agents no longer draw the
  // portal, so the runtime no longer ships its resolved portal tokens.
  reserved 12;
  reserved "portal_part_tokens";
}

// Server response: session error (auth failure, protocol violation, etc.)
message SessionError {
  string code    = 1;  // Error code (e.g. "AUTH_FAILED", "DUPLICATE_AGENT_ID")
  string message = 2;  // Human-readable explanation
  string hint    = 3;  // Machine-readable correction suggestion
}

// Server response to a valid SessionResume (RFC 0005 §6.3).
// Followed immediately by the current DegradationNotice.
// Agents MUST use the subscription state from this message rather than assuming
// their pre-disconnect subscription set is intact.
message SessionResumeResult {
  // Removed public tile/session surface; never reuse.
  reserved 4;
  reserved "negotiated_protocol_version";
  bool   accepted                        = 1;   // true = resume accepted; false = rejected
  bytes  new_session_token               = 2;   // New token for this resumed session (opaque bytes, e.g. UUIDv7)
  uint64 new_server_sequence             = 3;   // Current server-side sequence
  // Field 5 (granted_capabilities) removed in T5 S2.
  reserved 5;
  reserved "granted_capabilities";
  // Field 6 (error) removed in T5 S1: rejections are sent as SessionError.
  reserved 6;
  reserved "error";
  // Confirmed subscription state after resume. Agents MUST use these values.
  repeated string active_subscriptions   = 7;   // Confirmed active subscription set
  repeated string denied_subscriptions   = 8;   // Denied (not in allow list)
}

// ─── Safe-mode lifecycle messages (RFC 0005 §3.7) ─────────────────────────────

// Runtime notifies all active sessions that safe mode has been entered.
// While suspended, Publish is rejected with SAFE_MODE_ACTIVE. The session remains
// open and Heartbeat keepalives continue. Transactional — never dropped.
message SessionSuspended {
  string reason          = 1;  // Human-readable reason (e.g. "safe_mode_entered")
  uint64 timestamp_wall_us = 2; // Wall-clock time of suspension (UTC us since epoch)
}

// Runtime notifies all previously suspended sessions that safe mode has exited.
// After delivery, publication is permitted again. Transactional — never dropped.
message SessionResumed {
  uint64 timestamp_wall_us = 1; // Wall-clock time of resumption (UTC us since epoch)
}

// ─── Mutation messages ────────────────────────────────────────────────────────

// Optional timing semantics for a MutationBatch (RFC 0003 §3.5, §4.5).
// Clock domain: wall-clock (UTC µs since Unix epoch).
// 0 in either field means "no constraint" (present immediately / no expiry).
message TimingHints {
  // Wall-clock time at which mutations should be presented (UTC µs since epoch).
  // 0 = present immediately.
  // Rejected if < session_open_at_wall_us - 60_000_000 µs (TIMESTAMP_TOO_OLD).
  // Rejected if > current_wall_us + max_future_schedule_us (TIMESTAMP_TOO_FUTURE).
  uint64 present_at_wall_us = 1;

  // Wall-clock expiry for the mutations (UTC µs since epoch).
  // 0 = no expiry.
  // Rejected if > 0 and <= present_at_wall_us (TIMESTAMP_EXPIRY_BEFORE_PRESENT).
  uint64 expires_at_wall_us = 2;
}

// Internal-only container for scene mutation conversion. No public session route.
message MutationBatch {
  bytes  batch_id  = 1;  // UUIDv7; deduplication key (RFC 0005 SS5.2)
  bytes  lease_id  = 2;  // Lease under which mutations execute
  repeated tze_hud.protocol.v1.MutationProto mutations = 3;  // Ordered; applied atomically
  TimingHints timing = 4;  // Optional timing semantics (RFC 0003 §3.5)
}

// ─── Lifecycle verbs (docs/api.md) ───────────────────────────────────────────
//
// Surfaces use `zone:<name>` and `widget:<name>`. Times are milliseconds
// (`*_ms`); absolute wall-clock times are UTC microseconds (`*_us`).

// Publish to a zone or widget. Durable surfaces reply with RequestResult;
// ephemeral ones are fire-and-forget.
message Publish {
  string surface = 1;                              // zone:<name> or widget:<name>
  tze_hud.protocol.v1.ZoneContent content = 2;     // Zones
  repeated tze_hud.protocol.v1.WidgetParameterValueProto params = 3;  // Widgets
  uint64 ttl_ms = 4;         // 0 = surface default; counts from presentation
  uint64 present_at_us = 5;  // Hold until this wall-clock time (0 = now)
  uint64 expires_at_us = 6;  // Absolute expiry (0 = none); wins over ttl_ms
  string key = 7;            // Merge key for stack zones / keyed widgets
  repeated uint64 breakpoints = 8;  // StreamText reveal byte offsets (zones)
  uint32 transition_ms = 9;  // Widget parameter transition (0 = instant)
}

// Release this namespace's zone or widget publications.
message Clear {
  string surface = 1;
}

// Extend a holding without resending content.
message Hold {
  string surface = 1;  // zone:<name> or widget:<name>
  uint64 ttl_ms = 2;   // 0 = until cleared (subject to normal session/human reclamation).
}

// The one reply shape for requests. `seq` echoes the request envelope's
// sequence. On failure, `code` is from the closed set shared with MCP
// (docs/api.md) and `hint` names the fix.
message RequestResult {
  // Removed public tile/session surface; never reuse.
  reserved 5, 6, 8;
  reserved "ids", "lease_id", "batch_id";
  uint64 seq = 1;
  bool   ok = 2;
  string code = 3;
  string hint = 4;
  uint64 ttl_ms = 7;       // Granted or renewed TTL
}

// ─── Resident scene-resource upload messages ─────────────────────────────────

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  IMAGE_RGBA8 = 1;  // Raw RGBA8 bytes
  IMAGE_PNG   = 2;
  IMAGE_JPEG  = 3;
  FONT_TTF    = 4;
  FONT_OTF    = 5;
  IMAGE_SVG   = 6;
}

// Metadata for scene-resource uploads and store confirmation.
message ResourceMetadata {
  uint32 width      = 1;  // Image width in px (0 when not applicable)
  uint32 height     = 2;  // Image height in px (0 when not applicable)
  string font_family = 3; // Font family (empty when not applicable)
  string font_style  = 4; // Font style, e.g. "Regular" (empty when not applicable)
}

// Start a scene-resource upload. inline_data supports small fast-path uploads.
message ResourceUploadStart {
  bytes            expected_hash     = 1;  // BLAKE3 hash (32 bytes)
  ResourceType     resource_type     = 2;
  uint64           total_size_bytes  = 3;
  ResourceMetadata metadata          = 4;
  bytes            inline_data       = 5;  // Full payload for small uploads
}

// Runtime acknowledgement when chunk transfer is required.
message ResourceUploadAccepted {
  uint64 request_sequence = 1;  // Initiating ClientMessage.sequence
  bytes  upload_id        = 2;  // Opaque runtime-assigned upload id
}

// Chunk payload for an accepted upload.
message ResourceUploadChunk {
  bytes  upload_id    = 1;
  uint32 chunk_index  = 2;  // 0-based chunk index
  bytes  data         = 3;
}

// Finalize an accepted chunked upload.
message ResourceUploadComplete {
  bytes upload_id = 1;
}

// Successful upload completion (or dedup short-circuit).
message ResourceStored {
  uint64                       request_sequence = 1;  // Initiating ClientMessage.sequence
  tze_hud.protocol.v1.ResourceIdProto resource_id = 2;  // Confirmed content id
  bool                         was_deduplicated = 3;
  uint64                       stored_bytes      = 4;
  uint64                       decoded_bytes     = 5;
  ResourceMetadata             metadata          = 6;
  bytes                        upload_id         = 7;  // Present for accepted chunked uploads
}

enum ResourceErrorCode {
  RESOURCE_ERROR_UNSPECIFIED = 0;
  RESOURCE_CAPABILITY_DENIED = 1;
  RESOURCE_BUDGET_EXCEEDED = 2;
  RESOURCE_SIZE_EXCEEDED = 3;
  RESOURCE_UNSUPPORTED_TYPE = 4;
  RESOURCE_DECODE_ERROR = 5;
  RESOURCE_HASH_MISMATCH = 6;
  RESOURCE_CONFLICT = 7;
  RESOURCE_TOO_MANY_UPLOADS = 8;
  RESOURCE_NOT_FOUND = 9;
  RESOURCE_NOT_RESIDENT = 10;
  RESOURCE_RATE_LIMITED = 11;
}

// Upload-specific semantic failure response.
message ResourceErrorResponse {
  uint64            request_sequence = 1;  // Initiating ClientMessage.sequence
  ResourceErrorCode error_code       = 2;  // Stable machine-readable code
  string            message          = 3;  // Human-readable summary
  string            context          = 4;  // Structured context (JSON string)
  string            hint             = 5;  // Structured correction hint (JSON string)
  bytes             upload_id        = 6;  // Present when failure ties to accepted upload
}

// ─── Heartbeat ────────────────────────────────────────────────────────────────

// Bidirectional keepalive. Same message type in both directions.
// Clock domain: _mono_us for RTT measurement (RFC 0005 SS2.4).
message Heartbeat {
  uint64 timestamp_mono_us = 1;  // Monotonic clock (us); echoed for RTT calculation
}

// ─── Degradation (RFC 0005 §3.4, §7.1) ───────────────────────────────────────

// Degradation level reported by the runtime: full rendering, or the single
// Simplified fallback (downscaled textures, opaque fills, snapped animations).
enum DegradationLevel {
  DEGRADATION_LEVEL_UNSPECIFIED     = 0;  // Sentinel / unknown
  NORMAL                            = 1;  // Full rendering
  RENDERING_SIMPLIFIED              = 5;  // Simplified rendering under load
  // Values of the old degradation ladder, removed in the reset.
  reserved 2 to 4, 6 to 9;
  reserved "COALESCING_MORE", "MEDIA_QUALITY_REDUCED", "STREAMS_REDUCED",
    "SHEDDING_TILES", "AUDIO_ONLY_FALLBACK", "TEXTURE_QUALITY_REDUCED",
    "EMERGENCY_RENDERING";
}

// Runtime notifies all active sessions of a change in degradation level.
// Transactional — never dropped under backpressure (RFC 0005 §3.4).
// Delivered unconditionally to ALL active sessions regardless of subscription config.
// degradation_notices subscriptions SHALL NOT be filterable (RFC 0005 §7.1).
message DegradationNotice {
  DegradationLevel level              = 1;  // Current degradation level
  string           reason             = 2;  // Human-readable reason for the change
  reserved 3;  // affected_capabilities, always empty (removed in T5 S1)
  reserved "affected_capabilities";
  uint64           timestamp_wall_us  = 4;  // Wall-clock time of the level change (UTC µs)
}
