[package]
name = "tze_hud_runtime"
description = "Runtime kernel for tze_hud — frame pipeline, admission, budgets"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
## Enable dev-mode: allows `HeadlessConfig { config_toml: None }` to start with
## unrestricted capability grants. MUST NOT be enabled in production builds.
## Safe to enable in tests (which also compile under `cfg(test)`) and examples.
dev-mode = ["tze_hud_compositor/dev-mode", "tze_hud_telemetry/dev-mode"]
## Expose `windowed::HeadlessEventLoopHarness` (GPU-free, with live MCP and an
## injected clock) and headless gRPC listener adoption for end-to-end fixtures.
## Not for production builds.
test-harness = ["tze_hud_protocol/dev-mode", "tze_hud_mcp/test-harness"]

[dependencies]
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0" }
tze_hud_compositor = { path = "../tze_hud_compositor", version = "0.1.0" }
tze_hud_protocol = { path = "../tze_hud_protocol", version = "0.1.0" }
tze_hud_input = { path = "../tze_hud_input", version = "0.1.0" }
tze_hud_telemetry = { path = "../tze_hud_telemetry", version = "0.1.0" }
tze_hud_config = { path = "../tze_hud_config", version = "0.1.0" }
tze_hud_widget = { path = "../tze_hud_widget", version = "0.1.0" }
tze_hud_mcp = { path = "../tze_hud_mcp", version = "0.1.0" }
tze_hud_resource = { path = "../tze_hud_resource", version = "0.1.0" }
tze_hud_projection = { path = "../tze_hud_projection", version = "0.1.0" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
# Restart handoff nonce (OS CSPRNG) and its constant-time comparison; both are
# already in the tree via tze_hud_projection / tze_hud_protocol.
getrandom = { workspace = true }
subtle = { workspace = true }
arc-swap = { workspace = true }
if-addrs = "0.15"
# PNG encoding for GET /admin/screenshot; already in the tree via tze_hud_resource.
image = { workspace = true, features = ["png"] }
minisign-verify = "0.3.0"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
prost = { workspace = true }
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0" , features = ["test-support"] }
# Unit tests compile runtime with cfg(test), but its compositor dependency needs
# an explicit opt-in for the existing headless work-observation assertions.
tze_hud_compositor = { path = "../tze_hud_compositor", version = "0.1.0", features = ["dev-mode"] }
# dev-mode exposes HudSessionImpl::new(scene, psk) for the resident gRPC bridge
# end-to-end test, which stands up the production session server in-process.
tze_hud_protocol = { path = "../tze_hud_protocol", version = "0.1.0", features = ["dev-mode"] }
# test-util enables tokio's virtual-time control (start_paused/advance) used by
# the resident gRPC bridge reconnect/backoff + lease-renewal unit tests.
tokio = { workspace = true, features = ["test-util"] }
# pairing tests: temp agents.toml and a captured-log subscriber.
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
# The idle tests remain available with default features. The it root gates
# pixel readback, present-ack and their shared helpers on dev-mode: cfg(test)
# in this binary does not enable headless constructors in the linked library.

[lints]
workspace = true
