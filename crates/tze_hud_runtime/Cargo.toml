[package]
name = "tze_hud_runtime"
description = "Runtime kernel for tze_hud — frame pipeline, admission, budgets"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
## Enable dev-mode: allows `HeadlessConfig { config_toml: None }` to start with
## unrestricted capability grants. MUST NOT be enabled in production builds.
## Safe to enable in tests (which also compile under `cfg(test)`) and examples.
dev-mode = []
## Expose `windowed::HeadlessEventLoopHarness`: the GPU-free event-loop
## harness with a live MCP server and an injected clock, for end-to-end tests
## (`tests/integration/poc_acceptance.rs`). Not for production builds.
test-harness = []

[dependencies]
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0" }
tze_hud_compositor = { path = "../tze_hud_compositor", version = "0.1.0" }
tze_hud_protocol = { path = "../tze_hud_protocol", version = "0.1.0" }
tze_hud_input = { path = "../tze_hud_input", version = "0.1.0" }
tze_hud_telemetry = { path = "../tze_hud_telemetry", version = "0.1.0" }
tze_hud_config = { path = "../tze_hud_config", version = "0.1.0" }
tze_hud_widget = { path = "../tze_hud_widget", version = "0.1.0" }
tze_hud_mcp = { path = "../tze_hud_mcp", version = "0.1.0" }
tze_hud_resource = { path = "../tze_hud_resource", version = "0.1.0" }
tze_hud_projection = { path = "../tze_hud_projection", version = "0.1.0", features = ["resident-grpc"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
unicode-width = { workspace = true }
if-addrs = "0.15"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[dev-dependencies]
prost = { workspace = true }
tze_hud_scene = { path = "../tze_hud_scene", version = "0.1.0" }
tze_hud_compositor = { path = "../tze_hud_compositor", version = "0.1.0" }
# dev-mode exposes HudSessionImpl::new(scene, psk) for the resident gRPC bridge
# end-to-end test, which stands up the production session server in-process.
tze_hud_protocol = { path = "../tze_hud_protocol", version = "0.1.0", features = ["dev-mode"] }
# test-util enables tokio's virtual-time control (start_paused/advance) used by
# the resident gRPC bridge reconnect/backoff + lease-renewal unit tests.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "pixel_readback"
path = "tests/pixel_readback.rs"
# dev-mode required because pixel_helpers.rs uses config_toml: None.
# Integration tests are separate binaries; cfg(test) is set in them but NOT
# in the library they link, so the dev-mode feature must be explicit here.
required-features = ["dev-mode"]

[[test]]
name = "present_ack"
path = "tests/present_ack.rs"
# hud-91uu6: headless present-ack producer test uses HeadlessConfig
# { config_toml: None } (dev-mode) and the headless render surface.
required-features = ["dev-mode"]

[lints]
workspace = true
