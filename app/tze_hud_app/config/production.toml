# tze_hud Production Configuration
#
# This is the canonical production config for the tze_hud_app windowed binary.
# Deploy alongside the compiled binary as tze_hud.toml in the same directory
# (the runtime's CWD auto-resolution picks up ./tze_hud.toml first).
#
# On Windows, double-clicking tze_hud.exe installs it per user and writes this
# file to %APPDATA%\tze_hud\config.toml if none exists. Or copy tze_hud.exe and
# this file as tze_hud.toml next to it. No other files are needed: the gauge,
# progress-bar and status-indicator widget bundles are built into the exe.
#
# Usage:
#   tze_hud --window-mode overlay
#   tze_hud --config /path/to/tze_hud.toml --window-mode overlay
#
# Widget instance names (MCP surfaces widget:<name>):
#   widget:main-gauge      → gauge widget (level, label, fill_color, severity)
#   widget:main-progress   → progress-bar widget (progress, label, fill_color)
#   widget:main-status     → status-indicator widget (status, label, reason)
#
# See widget semantics in .claude/skills/user-test/SKILL.md:
# a widget surface addresses a widget *instance* (not a type). The instance name is
# the instance_id declared below — not the widget_type name.

# Runtime profile selection (required by loader schema).
# Keep this aligned with crates/tze_hud_config::loader validation:
# config MUST include [runtime] with profile and at least one [[tabs]] entry.
[runtime]
profile = "full-display"
# Global safe-mode toggle (works while the overlay is unfocused and click-through).
# Modifiers Ctrl/Shift/Alt/Win plus F1-F24, a letter, or a digit.
safe_mode_hotkey = "Ctrl+Shift+F12"

# Widget bundles: gauge, progress-bar and status-indicator are built into the
# exe. To override one (or add your own), add a [widget_bundles] table with
# `paths = ["dir"]` (relative to this file); each subdirectory holding a
# widget.toml is loaded, and a bundle with the same type name replaces the
# built-in one.

# Design tokens, shared by every zone, widget SVG, and the portal.
# `theme` selects a built-in theme ("tonal-glass", the default, or "classic").
# Any other key overrides one token on top of the theme, e.g.
#   "border.radius.medium" = "12"
# Keep overrides for deployment-specific values; visual design lives in themes
# (assets/themes/*.toml, documented in docs/api.md "Design tokens and themes").
[design_tokens]
theme = "tonal-glass"

# Main display tab — hosts all widget instances.
[[tabs]]
name        = "Main"
default_tab = true

# ── Gauge widget instance ─────────────────────────────────────────────────────
# MCP widget_name: "main-gauge"
# Parameters: level (f32 0–1), label (string), fill_color (color), severity (enum)
# Position: left edge, vertically centered; narrow vertical meter clear of subtitles.
# Widget sizes are fractions of the display: the compositor draws physical px,
# so on the owner's 3840x2160 panel each widget is 1.5x its SVG viewBox
# (matching tonal-glass's 1.5x tile classes). Gauge: 72x224 -> 108x336.
[[tabs.widgets]]
widget_type = "gauge"
instance_id  = "main-gauge"

[tabs.widgets.geometry]
x_pct      = 0.0125
y_pct      = 0.4222222
width_pct  = 0.028125
height_pct = 0.1555556

# ── Progress-bar widget instance ──────────────────────────────────────────────
# MCP widget_name: "main-progress"
# Parameters: progress (f32 0–1), label (string), fill_color (color)
# Position: bottom centre, above the subtitle zone. 360x52 -> 540x78 at 4K.
[[tabs.widgets]]
widget_type = "progress-bar"
instance_id  = "main-progress"

[tabs.widgets.geometry]
x_pct      = 0.4296875
y_pct      = 0.83
width_pct  = 0.140625
height_pct = 0.0361111

# ── Status-indicator widget instance ─────────────────────────────────────────
# MCP widget_name: "main-status"
# Parameters: status (enum), label (string), reason (string)
# Position: top right, just left of the notification zone (x >= 75%) so the
# badge never sits under a notification card; the tooltip opens down-left
# inside the widget bounds. 320x124 -> 480x186 at 4K.
[[tabs.widgets]]
widget_type = "status-indicator"
instance_id  = "main-status"

[tabs.widgets.geometry]
x_pct      = 0.62
y_pct      = 0.02
width_pct  = 0.125
height_pct = 0.0861111

# ── Agents ────────────────────────────────────────────────────────────────────
# Agents are not configured here. Pairing adds each agent's PSK SHA-256 and
# `allow` list to agents.toml next to this file.
