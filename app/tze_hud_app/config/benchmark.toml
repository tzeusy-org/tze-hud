# tze_hud Windows Benchmark Configuration
#
# This config is intentionally separate from production.toml. Use it for live
# Windows performance and soak runs where resident benchmark agents need
# explicit widget/zone publish grants. Deploy as C:\tze_hud\benchmark.toml and
# launch with scripts/windows/install_benchmark_hud_task.ps1.
#
# Production safety:
# - does not change the default production config
# - configures only named benchmark/demo agents
# - allows widget publish only for the committed widget instances below
# - agents without a table get nothing

[runtime]
profile = "full-display"

[widget_bundles]
paths = ["widget_bundles"]

[design_tokens]
"color.text.primary"                   = "#F5F7FA"
"color.border.default"                 = "#6E7A91"
"opacity.backdrop.opaque"              = "0.80"
"typography.body.size"                 = "15"
"typography.body.weight"               = "500"
"spacing.padding.medium"               = "10"
"border.radius.medium"                 = "14"
"color.notification.urgency.low"       = "#000000"
"color.notification.urgency.normal"    = "#0C1426"
"color.notification.urgency.urgent"    = "#2A1E08"
"color.notification.urgency.critical"  = "#450612"
"typography.notification.body.scale"   = "0.90"
"typography.notification.title.weight" = "700"

[[tabs]]
name = "Main"
default_tab = true

[[tabs.widgets]]
widget_type = "gauge"
instance_id = "main-gauge"

[tabs.widgets.geometry]
x = 40
y = 420
width = 100
height = 240

[[tabs.widgets]]
widget_type = "progress-bar"
instance_id = "main-progress"

[tabs.widgets.geometry]
x_pct = 0.421875
y_pct = 0.9074074
width_pct = 0.15625
height_pct = 0.0185185

[[tabs.widgets]]
widget_type = "status-indicator"
instance_id = "main-status"

[tabs.widgets.geometry]
x = 1660
y = 40
width = 252
height = 96

# Agents (the publish-load harness, the three-agent soak identities) are not
# configured here: pair them into agents.toml next to this file.
